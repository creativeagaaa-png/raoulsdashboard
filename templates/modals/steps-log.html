<!-- Steps Log Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-mobile-sheet"
     x-show="stepsLogOpen" x-cloak
     @keydown.tab.window="stepsLogOpen && trapFocus($event, $el)"
     role="dialog" aria-modal="true" aria-label="Steps log">

    <div class="absolute inset-0 bg-[#050505]/90 backdrop-blur-xl"
         x-show="stepsLogOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeStepsLog()"></div>

    <div class="bg-surface border border-white/10 rounded-3xl w-full max-w-sm relative z-10 shadow-[0_0_50px_rgba(0,0,0,0.5)] overflow-hidden max-h-[85vh] flex flex-col"
         x-show="stepsLogOpen"
         x-swipe-dismiss="closeStepsLog()"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <div class="p-8 pb-0">
            <!-- Grab Handle -->
            <div class="flex justify-center -mt-4 mb-2 md:hidden"><div class="w-10 h-1 rounded-full bg-white/15"></div></div>

            <div class="flex justify-between items-center mb-6">
                <span class="text-xs font-bold text-muted uppercase tracking-widest">Steps Log</span>
                <button @click="closeStepsLog()" aria-label="Close dialog" class="w-8 h-8 rounded-full flex items-center justify-center bg-white/5 hover:bg-white/10 text-muted hover:text-white transition-colors">
                    <i class="ph ph-x text-sm" aria-hidden="true"></i>
                </button>
            </div>

            <!-- Manual Input -->
            <div class="mb-6">
                <label class="text-[10px] text-muted font-bold uppercase tracking-widest mb-3 block">Add Steps</label>
                <div class="flex gap-2">
                    <div class="flex-1 bg-black/20 rounded-xl px-4 py-3 flex items-center gap-3 border border-white/5 hover:border-white/10 focus-within:border-white/20 transition-all">
                        <i class="ph ph-plus-circle text-muted"></i>
                        <input type="text" inputmode="numeric" x-model="stepsInput"
                               @keydown.enter="saveManualSteps()"
                               placeholder="e.g. 3000"
                               class="bg-transparent border-none focus:outline-none text-white w-full font-mono text-sm font-medium placeholder-white/20">
                    </div>
                    <button @click="saveManualSteps()"
                            :disabled="!stepsInput || isNaN(parseInt(stepsInput)) || parseInt(stepsInput) <= 0"
                            class="px-5 py-3 rounded-xl bg-white text-black font-bold text-xs hover:bg-gray-200 active:scale-[0.97] transition-all shadow-lg shadow-white/5 disabled:opacity-30 disabled:cursor-not-allowed">
                        <i class="ph-bold ph-plus"></i>
                    </button>
                </div>
                <div class="flex gap-2 mt-2">
                    <div class="flex-1 bg-black/20 rounded-xl px-4 py-3 flex items-center gap-3 border border-white/5 hover:border-white/10 focus-within:border-white/20 transition-all">
                        <i class="ph ph-calendar text-muted"></i>
                        <input type="date" x-model="stepsInputDate"
                               class="bg-transparent border-none focus:outline-none text-white w-full font-sans text-sm font-medium">
                    </div>
                </div>
                <p class="text-[10px] text-muted mt-2 ml-1">Will be added to the existing daily total</p>
            </div>

            <!-- Stats Summary -->
            <div class="grid grid-cols-3 gap-2 mb-6">
                <div class="p-3 rounded-2xl bg-white/5 border border-white/5 text-center">
                    <p class="text-[9px] text-muted uppercase tracking-wider font-bold mb-1">Today</p>
                    <span class="text-sm font-bold text-white tabular-nums" x-text="todaySteps.toLocaleString('en-US')"></span>
                </div>
                <div class="p-3 rounded-2xl bg-white/5 border border-white/5 text-center">
                    <p class="text-[9px] text-muted uppercase tracking-wider font-bold mb-1">7-Day</p>
                    <span class="text-sm font-bold text-white tabular-nums" x-text="stepsWeekAvg.toLocaleString('en-US')"></span>
                </div>
                <div class="p-3 rounded-2xl bg-white/5 border border-white/5 text-center">
                    <p class="text-[9px] text-muted uppercase tracking-wider font-bold mb-1">30-Day</p>
                    <span class="text-sm font-bold text-white tabular-nums" x-text="stepsMonthAvg.toLocaleString('en-US')"></span>
                </div>
            </div>

            <!-- View Toggle -->
            <div class="flex gap-1 p-1 bg-white/5 rounded-xl mb-4">
                <button @click="stepsLogView = 'days'"
                        :class="stepsLogView === 'days' ? 'bg-white/10 text-white' : 'text-muted hover:text-white'"
                        class="flex-1 py-2 px-3 rounded-lg text-[10px] font-bold uppercase tracking-widest transition-all">
                    Days
                </button>
                <button @click="stepsLogView = 'months'"
                        :class="stepsLogView === 'months' ? 'bg-white/10 text-white' : 'text-muted hover:text-white'"
                        class="flex-1 py-2 px-3 rounded-lg text-[10px] font-bold uppercase tracking-widest transition-all">
                    Months
                </button>
            </div>
        </div>

        <!-- Scrollable Log List -->
        <div class="overflow-y-auto px-8 pb-8 flex-1 min-h-0">
            <!-- Daily View -->
            <template x-if="stepsLogView === 'days'">
                <div class="flex flex-col gap-2">
                    <template x-if="stepsHistory.length === 0">
                        <div class="text-center py-8">
                            <i class="ph ph-footprints text-3xl text-muted mb-2"></i>
                            <p class="text-xs text-muted">No steps recorded yet</p>
                        </div>
                    </template>
                    <template x-for="entry in stepsHistory" :key="entry.date">
                        <div class="swipe-container" role="listitem"
                             x-data="{ startX: 0, currentX: 0, swiping: false }"
                             @touchstart.passive="startX = $event.touches[0].clientX; currentX = 0; swiping = false"
                             @touchmove="(() => {
                                 const dx = $event.touches[0].clientX - startX;
                                 if (dx < -10) { swiping = true; currentX = Math.max(dx, -120); $event.preventDefault(); }
                             })()"
                             @touchend="(() => {
                                 if (currentX < -80) {
                                     const d = entry.date;
                                     const comp = $data;
                                     $el.querySelector('.swipe-content').classList.add('removing');
                                     $el.querySelector('.swipe-content').style.transform = 'translateX(-100%)';
                                     setTimeout(() => comp.deleteStepEntry(d), 300);
                                 }
                                 else { currentX = 0; swiping = false; }
                             })()">
                            <div class="swipe-delete-bg" :class="{ 'visible': currentX < -10 }">
                                <i class="ph ph-trash text-rose-400 text-lg"></i>
                            </div>
                            <div class="swipe-content flex items-center justify-between py-3 px-4 rounded-2xl bg-white/[0.02] hover:bg-white/5 border border-white/5 transition-colors group"
                                 :class="{ 'swiping': swiping }"
                                 :style="currentX < 0 ? 'transform: translateX(' + currentX + 'px)' : ''">
                                <div class="flex flex-col">
                                    <span class="text-xs font-medium text-white"
                                          x-text="new Date(entry.date).toLocaleDateString('en-US', { weekday: 'short', day: '2-digit', month: 'short' })"></span>
                                    <span class="text-[10px] text-muted font-mono mt-0.5"
                                          x-text="(() => { const d = new Date(); return entry.date === d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') ? 'Today' : '' })()"></span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <div class="w-20 h-1.5 bg-white/5 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full transition-all duration-300"
                                             :class="{
                                                 'bg-red-400': entry.steps < 5000,
                                                 'bg-amber-400': entry.steps >= 5000 && entry.steps < 10000,
                                                 'bg-yellow-400': entry.steps >= 10000
                                             }"
                                             :style="`width: ${Math.min((entry.steps / 10000) * 100, 100)}%`"></div>
                                    </div>
                                    <span class="text-sm font-bold tabular-nums min-w-[60px] text-right"
                                          :class="{
                                              'text-red-400': entry.steps < 5000,
                                              'text-amber-400': entry.steps >= 5000 && entry.steps < 10000,
                                              'text-emerald-400': entry.steps >= 10000
                                          }"
                                          x-text="entry.steps.toLocaleString('en-US')"></span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Monthly View -->
            <template x-if="stepsLogView === 'months'">
                <div class="flex flex-col gap-2">
                    <template x-if="stepsMonthly.length === 0">
                        <div class="text-center py-8">
                            <i class="ph ph-footprints text-3xl text-muted mb-2"></i>
                            <p class="text-xs text-muted">No steps recorded yet</p>
                        </div>
                    </template>
                    <template x-for="month in stepsMonthly" :key="month.key">
                        <div class="py-3 px-4 rounded-2xl bg-white/[0.02] border border-white/5">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-white" x-text="month.label"></span>
                                <span class="text-[10px] text-muted font-mono" x-text="month.days + ' Days'"></span>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div class="text-center">
                                    <p class="text-[9px] text-muted uppercase font-bold">Avg</p>
                                    <span class="text-xs font-bold text-white tabular-nums" x-text="month.avg.toLocaleString('en-US')"></span>
                                </div>
                                <div class="text-center">
                                    <p class="text-[9px] text-muted uppercase font-bold">Total</p>
                                    <span class="text-xs font-bold text-white tabular-nums" x-text="month.total.toLocaleString('en-US')"></span>
                                </div>
                                <div class="text-center">
                                    <p class="text-[9px] text-muted uppercase font-bold">Best</p>
                                    <span class="text-xs font-bold text-emerald-400 tabular-nums" x-text="month.best.toLocaleString('en-US')"></span>
                                </div>
                            </div>
                            <div class="mt-2 h-1.5 bg-white/5 rounded-full overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-300"
                                     :class="{
                                         'bg-red-400': month.avg < 5000,
                                         'bg-amber-400': month.avg >= 5000 && month.avg < 10000,
                                         'bg-yellow-400': month.avg >= 10000
                                     }"
                                     :style="`width: ${Math.min((month.avg / 10000) * 100, 100)}%`"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>
</div>

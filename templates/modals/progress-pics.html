<!-- Progress Pics Modal -->
<div class="fixed inset-0 z-[55] flex flex-col modal-mobile-sheet"
     x-show="progressPicsOpen" x-cloak
     @keydown.tab.window="progressPicsOpen && trapFocus($event, $el)"
     role="dialog" aria-modal="true" aria-label="Progress Pics">

    <div class="absolute inset-0 bg-[#050505]/95 backdrop-blur-xl"
         x-show="progressPicsOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeProgressPics()"></div>

    <div class="relative z-10 flex flex-col h-full max-h-full overflow-hidden safe-area-body"
         x-show="progressPicsOpen"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-8 opacity-0" x-transition:enter-end="translate-y-0 opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100" x-transition:leave-end="translate-y-8 opacity-0">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 pt-5 pb-3 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center text-purple-400 border border-purple-500/20">
                    <i class="ph-fill ph-images-square"></i>
                </div>
                <h2 class="text-sm font-bold text-white uppercase tracking-wider">Progress Pics</h2>
                <span class="px-2 py-0.5 rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/20 text-[9px] font-bold"
                      x-text="photoDates.length + ' Fotos'"></span>
            </div>
            <button @click="closeProgressPics()"
                    class="w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-muted hover:text-white transition-colors"
                    aria-label="Schließen">
                <i class="ph-bold ph-x text-sm"></i>
            </button>
        </div>

        <!-- Comparison Slider -->
        <div class="px-5 pb-4 flex-shrink-0" x-show="progressPics.beforePhoto && progressPics.afterPhoto">
            <div class="relative rounded-2xl overflow-hidden h-[300px] md:h-[400px] select-none"
                 style="cursor: col-resize; touch-action: none;"
                 @mousedown="startSliderDrag($event)"
                 @mousemove="handleSliderDrag($event, $el)"
                 @mouseup="stopSliderDrag()"
                 @mouseleave="stopSliderDrag()"
                 @touchstart.prevent="startSliderDrag($event)"
                 @touchmove.prevent="handleSliderDrag($event, $el)"
                 @touchend="stopSliderDrag()">
                <img :src="progressPics.afterPhoto" class="absolute inset-0 w-full h-full object-cover" draggable="false">
                <div class="absolute inset-0 overflow-hidden" :style="`width: ${progressPics.sliderPosition}%`">
                    <img :src="progressPics.beforePhoto" class="absolute top-0 left-0 h-full object-cover" :style="`width: ${(10000 / progressPics.sliderPosition)}%`" draggable="false">
                </div>
                <div class="absolute top-0 bottom-0 w-0.5 bg-white shadow-[0_0_10px_rgba(255,255,255,0.5)] pointer-events-none" :style="`left: ${progressPics.sliderPosition}%`">
                    <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-9 h-9 rounded-full bg-white/90 backdrop-blur-sm flex items-center justify-center shadow-lg pointer-events-none">
                        <i class="ph-bold ph-arrows-horizontal text-black text-sm"></i>
                    </div>
                </div>
                <div class="absolute top-3 left-3 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-sm pointer-events-none">
                    <p class="text-[10px] font-bold text-white uppercase">Vorher</p>
                    <p class="text-[9px] text-white/60 font-mono" x-text="formatPhotoDate(progressPics.beforeDate)"></p>
                </div>
                <div class="absolute top-3 right-3 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur-sm pointer-events-none">
                    <p class="text-[10px] font-bold text-white uppercase text-right">Nachher</p>
                    <p class="text-[9px] text-white/60 font-mono text-right" x-text="formatPhotoDate(progressPics.afterDate)"></p>
                </div>
                <div class="absolute bottom-3 left-1/2 -translate-x-1/2 px-3 py-1.5 rounded-lg bg-black/60 backdrop-blur-sm pointer-events-none">
                    <span class="text-xs font-mono font-bold" :class="(() => { const bw = history.find(h => h.date === progressPics.beforeDate); const aw = history.find(h => h.date === progressPics.afterDate); if (!bw || !aw) return 'text-white'; const diff = aw.weight - bw.weight; return diff <= 0 ? 'text-emerald-400' : 'text-rose-400'; })()"
                          x-text="(() => { const bw = history.find(h => h.date === progressPics.beforeDate); const aw = history.find(h => h.date === progressPics.afterDate); if (!bw || !aw) return ''; const diff = aw.weight - bw.weight; return (diff > 0 ? '+' : '') + diff.toFixed(1) + ' kg'; })()"></span>
                </div>
            </div>
        </div>

        <!-- No comparison selected hint -->
        <div class="px-5 pb-4 flex-shrink-0" x-show="!(progressPics.beforePhoto && progressPics.afterPhoto) && progressPicsPhotos.length >= 2">
            <div class="h-[200px] rounded-2xl bg-white/[0.02] border border-dashed border-white/10 flex flex-col items-center justify-center gap-2">
                <i class="ph-duotone ph-arrows-horizontal text-2xl text-white/20"></i>
                <p class="text-xs text-muted">Tippe auf 2 Fotos zum Vergleichen</p>
            </div>
        </div>

        <!-- Selection buttons -->
        <div class="px-5 pb-3 flex gap-2 flex-shrink-0" x-show="progressPicsPhotos.length >= 2">
            <span class="text-[9px] text-muted uppercase tracking-wider font-bold self-center mr-1">Auswahl:</span>
            <button @click="progressPics._selectMode = 'before'"
                    class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider transition-all"
                    :class="progressPics._selectMode === 'before' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'bg-white/5 text-muted border border-white/5 hover:bg-white/10'">
                Vorher
            </button>
            <button @click="progressPics._selectMode = 'after'"
                    class="px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider transition-all"
                    :class="progressPics._selectMode === 'after' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' : 'bg-white/5 text-muted border border-white/5 hover:bg-white/10'">
                Nachher
            </button>
        </div>

        <!-- Loading -->
        <div x-show="progressPicsLoading" class="flex-1 flex items-center justify-center">
            <div class="text-center">
                <div class="w-8 h-8 border-2 border-purple-400/30 border-t-purple-400 rounded-full animate-spin mx-auto mb-3"></div>
                <p class="text-xs text-muted">Fotos werden geladen...</p>
            </div>
        </div>

        <!-- Empty state -->
        <div x-show="!progressPicsLoading && progressPicsLoaded && progressPicsPhotos.length === 0" class="flex-1 flex items-center justify-center">
            <div class="text-center">
                <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-center mx-auto mb-4">
                    <i class="ph-duotone ph-image text-3xl text-white/20"></i>
                </div>
                <p class="text-sm text-muted mb-1">Noch keine Fotos</p>
                <p class="text-xs text-white/20">Fotos beim Gewicht-Loggen hinzufuegen</p>
            </div>
        </div>

        <!-- Photo Grid -->
        <div x-show="progressPicsLoaded && progressPicsPhotos.length > 0"
             class="flex-1 overflow-y-auto px-5 pb-5 custom-scrollbar">
            <div class="grid grid-cols-3 gap-2">
                <template x-for="(item, idx) in progressPicsPhotos" :key="item.date">
                    <div @click="selectForCompare(item, progressPics._selectMode || 'before'); if (progressPics._selectMode === 'before') { progressPics._selectMode = 'after' } else { progressPics._selectMode = 'before' }"
                         class="relative rounded-xl overflow-hidden cursor-pointer group aspect-square"
                         :class="item.date === progressPics.beforeDate ? 'ring-2 ring-blue-400 ring-offset-1 ring-offset-[#050505]' : (item.date === progressPics.afterDate ? 'ring-2 ring-purple-400 ring-offset-1 ring-offset-[#050505]' : '')">
                        <img :src="item.photo"
                             class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                             loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
                        <div class="absolute bottom-0 left-0 right-0 p-1.5">
                            <p class="text-[9px] text-white/80 font-bold" x-text="formatPhotoDate(item.date)"></p>
                            <p x-show="item.weight" class="text-[9px] text-white/50 font-mono" x-text="item.weight ? item.weight.toFixed(1) + ' kg' : ''"></p>
                        </div>
                        <!-- Selection badge -->
                        <div x-show="isSelectedForCompare(item.date)"
                             class="absolute top-1.5 left-1.5 px-1.5 py-0.5 rounded-md text-[8px] font-bold uppercase"
                             :class="item.date === progressPics.beforeDate ? 'bg-blue-500/80 text-white' : 'bg-purple-500/80 text-white'"
                             x-text="getCompareLabel(item.date)"></div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

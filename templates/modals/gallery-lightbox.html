<!-- Gallery Lightbox Modal -->
<div class="fixed inset-0 z-[55] flex items-center justify-center p-4 modal-mobile-sheet"
     x-show="galleryLightbox.open" x-cloak
     role="dialog" aria-modal="true" aria-label="Foto Ansicht">

    <div class="absolute inset-0 bg-[#050505]/95 backdrop-blur-xl"
         x-show="galleryLightbox.open"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeGalleryLightbox()"></div>

    <div class="relative z-10 w-full max-w-2xl max-h-[85vh] flex flex-col"
         x-show="galleryLightbox.open"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <button @click="closeGalleryLightbox()"
                class="absolute top-3 right-3 z-20 w-10 h-10 rounded-full bg-black/60 backdrop-blur-sm flex items-center justify-center text-white hover:bg-white/20 transition-colors"
                aria-label="Schließen">
            <span class="text-lg">✕</span>
        </button>

        <div class="rounded-2xl overflow-hidden bg-surface border border-white/10 shadow-2xl">
            <img :src="galleryLightbox.photo"
                 class="w-full max-h-[70vh] object-contain"
                 :alt="'Foto vom ' + formatGalleryDate(galleryLightbox.date || '')">

            <div class="p-4 flex items-center justify-between bg-surface border-t border-white/5">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center text-purple-400 border border-purple-500/20">
                        <span>📅</span>
                    </div>
                    <span class="text-sm font-bold text-white" x-text="formatGalleryDate(galleryLightbox.date || '')"></span>
                </div>
                <div x-show="galleryLightbox.weight" class="flex items-center gap-2">
                    <span class="text-sm font-mono font-bold text-white" x-text="galleryLightbox.weight ? galleryLightbox.weight.toFixed(1) + ' kg' : ''"></span>
                </div>
            </div>
        </div>
    </div>
</div>

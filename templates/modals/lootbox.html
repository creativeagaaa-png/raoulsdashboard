<!-- Lootbox / Milestone Unlocked Modal -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 md:p-6 modal-mobile-sheet"
     x-show="lootboxOpen" x-cloak
     role="dialog" aria-modal="true" aria-label="Milestone unlocked"
     @keydown.enter.window="lootboxOpen && closeLootbox()">

    <div class="absolute inset-0 bg-black/90 backdrop-blur-xl transition-opacity duration-700"
         x-show="lootboxOpen"
         x-transition:enter="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeLootbox()"></div>

    <div class="relative z-10 w-full max-w-sm text-center transform transition-all duration-700"
         x-show="lootboxOpen"
         x-transition:enter="scale-75 opacity-0 translate-y-20 blur-sm"
         x-transition:enter-end="scale-100 opacity-100 translate-y-0 blur-0">

        <div class="mb-10 relative inline-block">
            <div class="absolute inset-0 bg-white/30 blur-[60px] rounded-full animate-pulse"></div>
            <div class="w-32 h-32 rounded-[2rem] bg-gradient-to-tr from-white to-gray-400 text-black flex items-center justify-center shadow-2xl relative z-10 animate-float border-4 border-white/20">
                <i class="ph-duotone text-6xl" :class="unlockedReward?.icon || 'ph-star'"></i>
            </div>
        </div>

        <h2 class="text-4xl font-black text-white mb-3 tracking-tight">Milestone Unlocked!</h2>
        <div class="w-16 h-1 bg-white/20 rounded-full mx-auto mb-6"></div>
        <p class="text-lg text-gray-300 font-medium mb-10" x-text="unlockedReward?.title"></p>

        <button @click="closeLootbox()" class="w-full px-8 py-5 rounded-2xl bg-white text-black font-bold text-sm hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_30px_rgba(255,255,255,0.15)]">
            Awesome, Continue
        </button>
    </div>
</div>

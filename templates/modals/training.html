<!-- Training Plan Modal -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-mobile-sheet"
     :class="trainingOpen ? 'pointer-events-auto' : 'pointer-events-none'"
     role="dialog" aria-modal="true" aria-label="Training Plan">

    <div class="absolute inset-0 bg-[#050505]/90 backdrop-blur-xl"
         x-show="trainingOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeTraining()"></div>

    <div class="bg-surface border border-white/10 rounded-3xl w-full max-w-lg max-h-[85vh] flex flex-col relative z-10 shadow-2xl overflow-hidden"
         x-show="trainingOpen"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-surface z-20 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-emerald-500/15 flex items-center justify-center text-emerald-400 border border-emerald-500/20">
                    <span class="text-lg">🏋️</span>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white">Training Plan</h2>
                    <p class="text-[10px] text-muted uppercase tracking-widest font-mono" x-text="WEEKDAYS[trainingSelectedDay]"></p>
                </div>
            </div>
            <button type="button" @click="closeTraining()" class="text-muted hover:text-white transition-colors p-2 -mr-2 hover:bg-white/5 rounded-xl">
                <span class="text-lg">✕</span>
            </button>
        </div>

        <div class="px-6 pt-5 pb-3 flex gap-1.5 shrink-0 overflow-x-auto">
            <template x-for="(day, idx) in WEEKDAY_SHORT" :key="idx">
                <button @click="trainingSelectedDay = idx"
                        class="relative flex-1 min-w-[44px] py-2.5 rounded-xl text-xs font-bold transition-all duration-300 border"
                        :class="trainingSelectedDay === idx
                            ? 'bg-white text-black border-white shadow-lg shadow-white/10 scale-105'
                            : idx === getTodayWeekdayIndex()
                                ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 hover:bg-emerald-500/20'
                                : 'bg-white/5 text-muted border-white/5 hover:bg-white/10 hover:text-white'">
                    <span x-text="day"></span>
                    <span x-show="trainingForm[idx].length > 0"
                          class="absolute -top-1 -right-1 w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center"
                          :class="trainingSelectedDay === idx ? 'bg-black text-white' : 'bg-white/20 text-white'"
                          x-text="trainingForm[idx].length"></span>
                </button>
            </template>
        </div>

        <div class="overflow-y-auto flex-1 px-6 pb-2 custom-scrollbar">
            <div class="space-y-2 mb-4">
                <template x-for="(ex, exIdx) in trainingForm[trainingSelectedDay]" :key="exIdx">
                    <div class="group p-4 rounded-2xl bg-white/5 border border-white/5 hover:border-white/10 transition-all duration-300 animate-list-item"
                         :style="'--item-delay: ' + (exIdx * 0.05) + 's'">
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-center gap-3 flex-1 min-w-0">
                                <span class="w-7 h-7 rounded-lg bg-emerald-500/15 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-xs font-bold tabular-nums shrink-0" x-text="exIdx + 1"></span>
                                <div class="flex-1 min-w-0">
                                    <input type="text" x-model="ex.name" @input="markTrainingDirty()"
                                           class="w-full bg-transparent border-none p-0 text-sm font-bold text-white focus:outline-none placeholder-white/20" placeholder="Exercise name">
                                    <div class="flex items-center gap-3 mt-1.5">
                                        <div class="flex items-center gap-1">
                                            <input type="number" x-model="ex.sets" @input="markTrainingDirty()"
                                                   class="w-10 bg-white/5 border border-white/5 rounded-md px-1.5 py-0.5 text-[11px] text-center text-white font-mono focus:outline-none focus:border-white/20" placeholder="0">
                                            <span class="text-[10px] text-muted">Sets</span>
                                        </div>
                                        <span class="text-white/10">x</span>
                                        <div class="flex items-center gap-1">
                                            <input type="text" x-model="ex.reps" @input="markTrainingDirty()"
                                                   class="w-14 bg-white/5 border border-white/5 rounded-md px-1.5 py-0.5 text-[11px] text-center text-white font-mono focus:outline-none focus:border-white/20" placeholder="0">
                                            <span class="text-[10px] text-muted">Reps</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-1 opacity-60 md:opacity-0 md:group-hover:opacity-100 transition-opacity duration-200">
                                <button @click="moveExercise(trainingSelectedDay, exIdx, -1)" class="p-1 text-muted hover:text-white transition-colors" :class="exIdx === 0 && 'opacity-30 pointer-events-none'">
                                    <span class="text-xs">▲</span>
                                </button>
                                <button @click="removeExercise(trainingSelectedDay, exIdx)" class="p-1 text-muted hover:text-rose-400 transition-colors">
                                    <span class="text-xs">🗑️</span>
                                </button>
                                <button @click="moveExercise(trainingSelectedDay, exIdx, 1)" class="p-1 text-muted hover:text-white transition-colors" :class="exIdx === trainingForm[trainingSelectedDay].length - 1 && 'opacity-30 pointer-events-none'">
                                    <span class="text-xs">▼</span>
                                </button>
                            </div>
                        </div>
                        <div class="mt-2">
                            <input type="text" x-model="ex.note" @input="markTrainingDirty()"
                                   class="w-full bg-transparent border-none p-0 text-[11px] text-muted focus:outline-none focus:text-white/60 placeholder-white/10 transition-colors" placeholder="Note (optional)">
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="trainingForm[trainingSelectedDay].length === 0"
                 class="flex flex-col items-center justify-center py-10 text-center">
                <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-center mb-4">
                    <span class="text-3xl text-white/20">🌙</span>
                </div>
                <p class="text-sm font-medium text-white/40 mb-1">Rest Day</p>
                <p class="text-[11px] text-muted">Keine Übungen geplant. Füge welche hinzu!</p>
            </div>

            <div class="p-4 rounded-2xl border border-dashed border-white/10 bg-white/[0.02] hover:border-white/20 transition-all duration-300 mt-2 mb-4">
                <p class="text-[10px] text-muted uppercase tracking-widest font-bold mb-3">Übung hinzufügen</p>
                <div class="space-y-3">
                    <input type="text" x-model="trainingNewExercise.name" @keydown.enter="addExercise()"
                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-sm text-white font-medium focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Name der Übung">
                    <div class="grid grid-cols-3 gap-2">
                        <div class="relative">
                            <input type="number" x-model="trainingNewExercise.sets" @keydown.enter="addExercise()"
                                   class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Sets">
                        </div>
                        <div class="relative">
                            <input type="text" x-model="trainingNewExercise.reps" @keydown.enter="addExercise()"
                                   class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Reps">
                        </div>
                        <button @click="addExercise()"
                                class="py-2.5 rounded-xl bg-emerald-500/15 text-emerald-400 font-bold text-xs border border-emerald-500/20 hover:bg-emerald-500/25 hover:border-emerald-500/40 active:scale-95 transition-all">
                            <span>＋</span> Add
                        </button>
                    </div>
                    <input type="text" x-model="trainingNewExercise.note" @keydown.enter="addExercise()"
                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-2.5 text-xs text-muted focus:border-white/20 focus:text-white outline-none transition-colors" placeholder="Note (optional)">
                </div>
            </div>
        </div>

        <div class="p-6 border-t border-white/5 bg-surface z-20 flex gap-3 shrink-0">
            <button type="button" @click="closeTraining()" class="flex-1 py-3.5 rounded-xl border border-white/5 text-muted font-bold text-xs hover:bg-white/5 active:scale-[0.97] transition-all">
                Cancel
            </button>
            <button type="button" @click="applyTraining()" class="flex-1 py-3.5 rounded-xl bg-white text-black font-bold text-xs hover:bg-gray-200 active:scale-[0.97] transition-all shadow-lg shadow-white/5">
                Save Plan
            </button>
        </div>
    </div>
</div>

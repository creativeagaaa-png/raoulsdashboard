<!-- Training Plan Modal -->
<div class="fixed inset-0 z-60 flex items-center justify-center p-4 modal-mobile-sheet"
     :class="trainingOpen ? 'pointer-events-auto' : 'pointer-events-none'"
     role="dialog" aria-modal="true" aria-label="Trainingsplan">

    <div class="absolute inset-0 bg-(--backdrop) backdrop-blur-xl"
         x-show="trainingOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeTraining()"></div>

    <div class="bg-surface border border-(--glass-border) rounded-3xl w-full max-w-lg max-h-[85vh] flex flex-col relative z-10 shadow-2xl overflow-hidden"
         x-show="trainingOpen"
         x-swipe-dismiss="closeTraining()"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <!-- Grab Handle -->
        <div class="flex justify-center pt-3 pb-1 md:hidden"><div class="w-10 h-1 rounded-full bg-white/15"></div></div>

        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-surface z-20 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-blue-500/12 flex items-center justify-center text-blue-400 border border-blue-500/20">
                    <i class="ph-bold ph-barbell text-lg"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white">Trainingsplan</h2>
                    <p class="text-[10px] text-muted uppercase tracking-widest font-mono" x-text="WEEKDAYS[trainingSelectedDay]"></p>
                </div>
            </div>
            <button type="button" @click="closeTraining()" class="text-muted hover:text-white transition-colors p-2 -mr-2 hover:bg-white/5 rounded-xl">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <div class="px-6 pt-5 pb-3 flex gap-1.5 shrink-0 overflow-x-auto">
            <template x-for="(day, idx) in WEEKDAY_SHORT" :key="idx">
                <button @click="trainingSelectedDay = idx"
                        class="relative flex-1 min-w-11 py-2.5 rounded-xl text-xs font-bold transition-all duration-300 border"
                        :class="trainingSelectedDay === idx
                            ? 'bg-white text-black border-white shadow-lg shadow-white/10 scale-105'
                            : idx === getTodayWeekdayIndex()
                                ? 'bg-blue-500/10 text-blue-400 border-blue-500/20 hover:bg-blue-500/20'
                                : 'bg-white/5 text-muted border-white/5 hover:bg-white/10 hover:text-white'">
                    <span x-text="day"></span>
                    <span x-show="trainingForm[idx].length > 0"
                          class="absolute -top-1 -right-1 w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center"
                          :class="trainingSelectedDay === idx ? 'bg-black text-white' : 'bg-white/20 text-white'"
                          x-text="trainingForm[idx].length"></span>
                </button>
            </template>
        </div>

        <div class="overflow-y-auto flex-1 px-6 pb-2 custom-scrollbar">
            <div class="space-y-2 mb-4">
                <template x-for="(ex, exIdx) in trainingForm[trainingSelectedDay]" :key="exIdx">
                    <div class="group p-4 rounded-2xl bg-white/5 border border-white/5 hover:border-white/10 transition-all duration-300 animate-list-item"
                         :style="'--item-delay: ' + (exIdx * 0.05) + 's'">
                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-center gap-3 flex-1 min-w-0">
                                <span class="w-7 h-7 rounded-lg bg-blue-500/12 border border-blue-500/20 flex items-center justify-center text-blue-400 text-xs font-bold tabular-nums shrink-0" x-text="exIdx + 1"></span>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2">
                                        <input type="text" x-model="ex.name" @input="markTrainingDirty()"
                                               class="flex-1 bg-transparent border-none p-0 text-sm font-bold text-white focus:outline-none placeholder-white/20" placeholder="Übungsname">
                                        <select x-model="ex.type" @change="markTrainingDirty()"
                                                class="bg-white/5 border border-white/5 rounded-md px-1.5 py-0.5 text-[10px] text-muted font-bold uppercase focus:outline-none focus:border-white/20 appearance-none cursor-pointer">
                                            <option value="strength">Kraft</option>
                                            <option value="cardio">Cardio</option>
                                            <option value="distance">Distanz</option>
                                            <option value="circuit">Zirkel</option>
                                        </select>
                                    </div>
                                    <!-- Strength: Sets x Reps + Weight -->
                                    <div x-show="(ex.type || 'strength') === 'strength'" class="grid grid-cols-3 gap-2 mt-2.5">
                                        <div class="bg-black/20 rounded-xl p-2.5 text-center border border-white/5">
                                            <div class="text-[9px] text-muted uppercase tracking-wider mb-1">Sätze</div>
                                            <input type="number" x-model="ex.sets" @input="markTrainingDirty()"
                                                   class="w-full bg-transparent border-none text-center text-base font-bold text-white font-mono focus:outline-none placeholder-white/15" placeholder="0">
                                        </div>
                                        <div class="bg-black/20 rounded-xl p-2.5 text-center border border-white/5">
                                            <div class="text-[9px] text-muted uppercase tracking-wider mb-1">Wdh.</div>
                                            <input type="text" x-model="ex.reps" @input="markTrainingDirty()"
                                                   class="w-full bg-transparent border-none text-center text-base font-bold text-white font-mono focus:outline-none placeholder-white/15" placeholder="0">
                                        </div>
                                        <div class="bg-black/20 rounded-xl p-2.5 text-center border border-white/5">
                                            <div class="text-[9px] text-muted uppercase tracking-wider mb-1">Gewicht</div>
                                            <input type="number" inputmode="decimal" step="0.5" x-model="ex.weight" @input="markTrainingDirty()"
                                                   class="w-full bg-transparent border-none text-center text-base font-bold text-white font-mono focus:outline-none placeholder-white/15" placeholder="–">
                                        </div>
                                    </div>
                                    <!-- Cardio: Duration -->
                                    <div x-show="ex.type === 'cardio'" class="mt-2.5">
                                        <div class="bg-black/20 rounded-xl p-2.5 text-center border border-white/5">
                                            <div class="text-[9px] text-muted uppercase tracking-wider mb-1">Dauer</div>
                                            <input type="text" x-model="ex.duration" @input="markTrainingDirty()"
                                                   class="w-full bg-transparent border-none text-center text-base font-bold text-white font-mono focus:outline-none placeholder-white/15" placeholder="30 min">
                                        </div>
                                    </div>
                                    <!-- Distance: Distance + Duration -->
                                    <div x-show="ex.type === 'distance'" class="grid grid-cols-2 gap-2 mt-2.5">
                                        <div class="bg-black/20 rounded-xl p-2.5 text-center border border-white/5">
                                            <div class="text-[9px] text-muted uppercase tracking-wider mb-1">Distanz</div>
                                            <input type="text" x-model="ex.distance" @input="markTrainingDirty()"
                                                   class="w-full bg-transparent border-none text-center text-base font-bold text-white font-mono focus:outline-none placeholder-white/15" placeholder="5 km">
                                        </div>
                                        <div class="bg-black/20 rounded-xl p-2.5 text-center border border-white/5">
                                            <div class="text-[9px] text-muted uppercase tracking-wider mb-1">Dauer</div>
                                            <input type="text" x-model="ex.duration" @input="markTrainingDirty()"
                                                   class="w-full bg-transparent border-none text-center text-base font-bold text-white font-mono focus:outline-none placeholder-white/15" placeholder="30 min">
                                        </div>
                                    </div>
                                    <!-- Circuit: Rounds + Exercises list (editable) -->
                                    <div x-show="ex.type === 'circuit'" class="mt-2.5">
                                        <div class="bg-black/20 rounded-xl p-2.5 text-center border border-white/5 mb-2">
                                            <div class="text-[9px] text-muted uppercase tracking-wider mb-1">Runden</div>
                                            <input type="number" x-model="ex.rounds" @input="markTrainingDirty()"
                                                   class="w-full bg-transparent border-none text-center text-base font-bold text-white font-mono focus:outline-none placeholder-white/15" placeholder="3">
                                        </div>
                                        <div x-show="ex.circuitExercises && ex.circuitExercises.length > 0" class="space-y-1.5 mt-2">
                                            <template x-for="(ce, ceIdx) in (ex.circuitExercises || [])" :key="ceIdx">
                                                <div class="flex items-center gap-1.5">
                                                    <span class="w-4 text-center text-white/30 text-[10px] shrink-0" x-text="ceIdx + 1"></span>
                                                    <input type="text" x-model="ce.name" @input="markTrainingDirty()"
                                                           class="flex-1 bg-black/20 border border-white/5 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none focus:border-white/20 min-w-0 transition-colors" placeholder="Übung">
                                                    <input type="text" x-model="ce.reps" @input="markTrainingDirty()"
                                                           class="w-12 bg-black/20 border border-white/5 rounded-lg px-2 py-2 text-xs text-center text-white font-mono focus:outline-none focus:border-white/20 transition-colors" placeholder="Wdh.">
                                                    <input type="number" inputmode="decimal" step="0.5" x-model="ce.weight" @input="markTrainingDirty()"
                                                           class="w-12 bg-black/20 border border-white/5 rounded-lg px-2 py-2 text-xs text-center text-white font-mono focus:outline-none focus:border-white/20 transition-colors" placeholder="kg">
                                                    <input type="text" x-model="ce.duration" @input="markTrainingDirty()"
                                                           class="w-14 bg-black/20 border border-white/5 rounded-lg px-2 py-2 text-xs text-center text-white font-mono focus:outline-none focus:border-white/20 transition-colors" placeholder="Zeit">
                                                    <button @click="ex.circuitExercises.splice(ceIdx, 1); markTrainingDirty()" x-show="ex.circuitExercises.length > 1"
                                                            class="p-1 text-muted hover:text-rose-400 transition-colors shrink-0">
                                                        <i class="ph ph-x text-xs"></i>
                                                    </button>
                                                </div>
                                            </template>
                                        </div>
                                        <button type="button" @click="ex.circuitExercises.push({name:'',reps:'',duration:'',weight:''}); markTrainingDirty()"
                                                class="mt-2 w-full py-1.5 rounded-lg border border-dashed border-white/10 text-[10px] text-muted hover:text-white hover:border-white/20 transition-all">
                                            <i class="ph ph-plus text-xs"></i> Übung hinzufügen
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col gap-1 opacity-60 md:opacity-0 md:group-hover:opacity-100 transition-opacity duration-200">
                                <button @click="moveExercise(trainingSelectedDay, exIdx, -1)" class="p-1 text-muted hover:text-white transition-colors" :class="exIdx === 0 && 'opacity-30 pointer-events-none'">
                                    <i class="ph ph-caret-up text-xs"></i>
                                </button>
                                <button @click="removeExercise(trainingSelectedDay, exIdx)" class="p-1 text-muted hover:text-rose-400 transition-colors">
                                    <i class="ph ph-trash text-xs"></i>
                                </button>
                                <button @click="moveExercise(trainingSelectedDay, exIdx, 1)" class="p-1 text-muted hover:text-white transition-colors" :class="exIdx === trainingForm[trainingSelectedDay].length - 1 && 'opacity-30 pointer-events-none'">
                                    <i class="ph ph-caret-down text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <div class="mt-2">
                            <input type="text" x-model="ex.note" @input="markTrainingDirty()"
                                   class="w-full bg-transparent border-none p-0 text-[11px] text-muted focus:outline-none focus:text-white/60 placeholder-white/10 transition-colors" placeholder="Notiz (optional)">
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="trainingForm[trainingSelectedDay].length === 0"
                 class="flex flex-col items-center justify-center py-10 text-center">
                <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-center mb-4">
                    <i class="ph ph-moon-stars text-3xl text-white/20"></i>
                </div>
                <p class="text-sm font-medium text-white/40 mb-1">Ruhetag</p>
                <p class="text-[11px] text-muted">Keine Übungen geplant. Füge welche hinzu!</p>
            </div>

            <!-- Add Exercise Toggle Button -->
            <button type="button" @click="trainingShowAddForm = !trainingShowAddForm"
                    class="w-full mt-2 mb-2 py-3 rounded-2xl border border-dashed transition-all duration-300 flex items-center justify-center gap-2 text-xs font-bold"
                    :class="trainingShowAddForm ? 'border-blue-500/30 bg-blue-500/5 text-blue-400' : 'border-white/10 bg-white/2 text-muted hover:border-white/20 hover:text-white'">
                <i class="ph-bold ph-plus text-sm transition-transform duration-300" :class="trainingShowAddForm && 'rotate-45'"></i>
                <span x-text="trainingShowAddForm ? 'Abbrechen' : 'Übung hinzufügen'"></span>
            </button>

            <!-- Add Exercise Form (collapsible) -->
            <div x-show="trainingShowAddForm"
                 x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-2"
                 class="p-4 rounded-2xl border border-dashed border-blue-500/20 bg-blue-500/2 transition-all duration-300 mb-4">
                <p class="text-[10px] text-blue-400 uppercase tracking-widest font-bold mb-3">Neue Übung</p>
                <div class="space-y-3">
                    <input type="text" x-model="trainingNewExercise.name" @keydown.enter="addExercise()"
                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-sm text-white font-medium focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Übungsname">
                    <div class="flex gap-1.5">
                        <template x-for="t in [{id:'strength',label:'Kraft'},{id:'cardio',label:'Cardio'},{id:'distance',label:'Distanz'},{id:'circuit',label:'Zirkel'}]" :key="t.id">
                            <button type="button" @click="trainingNewExercise.type = t.id"
                                    class="flex-1 py-2 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all border"
                                    :class="trainingNewExercise.type === t.id ? 'bg-blue-500/15 text-blue-400 border-blue-500/30' : 'bg-white/5 text-muted border-white/5 hover:bg-white/10'"
                                    x-text="t.label"></button>
                        </template>
                    </div>
                    <!-- Strength fields -->
                    <div x-show="trainingNewExercise.type === 'strength'" class="space-y-2">
                        <div class="grid grid-cols-3 gap-2">
                            <input type="number" x-model="trainingNewExercise.sets" @keydown.enter="addExercise()"
                                   class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Sätze">
                            <input type="text" x-model="trainingNewExercise.reps" @keydown.enter="addExercise()"
                                   class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Wdh.">
                            <input type="number" inputmode="decimal" step="0.5" x-model="trainingNewExercise.weight" @keydown.enter="addExercise()"
                                   class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="kg">
                        </div>
                        <button @click="addExercise()"
                                class="w-full py-2.5 rounded-xl bg-blue-500/15 text-blue-400 font-bold text-xs border border-blue-500/20 hover:bg-blue-500/25 hover:border-blue-500/40 active:scale-95 transition-all">
                            <i class="ph ph-plus"></i> Hinzufügen
                        </button>
                    </div>
                    <!-- Cardio fields -->
                    <div x-show="trainingNewExercise.type === 'cardio'" class="grid grid-cols-2 gap-2">
                        <input type="text" x-model="trainingNewExercise.reps" @keydown.enter="addExercise()"
                               class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Dauer (z.B. 30 min)">
                        <button @click="addExercise()"
                                class="py-2.5 rounded-xl bg-blue-500/15 text-blue-400 font-bold text-xs border border-blue-500/20 hover:bg-blue-500/25 hover:border-blue-500/40 active:scale-95 transition-all">
                            <i class="ph ph-plus"></i> Hinzufügen
                        </button>
                    </div>
                    <!-- Distance fields -->
                    <div x-show="trainingNewExercise.type === 'distance'" class="grid grid-cols-3 gap-2">
                        <input type="text" x-model="trainingNewExercise.sets" @keydown.enter="addExercise()"
                               class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Distanz (km)">
                        <input type="text" x-model="trainingNewExercise.reps" @keydown.enter="addExercise()"
                               class="w-full bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Dauer">
                        <button @click="addExercise()"
                                class="py-2.5 rounded-xl bg-blue-500/15 text-blue-400 font-bold text-xs border border-blue-500/20 hover:bg-blue-500/25 hover:border-blue-500/40 active:scale-95 transition-all">
                            <i class="ph ph-plus"></i> Hinzufügen
                        </button>
                    </div>
                    <!-- Circuit fields -->
                    <div x-show="trainingNewExercise.type === 'circuit'" class="space-y-2">
                        <div class="flex items-center gap-2">
                            <input type="number" x-model="trainingNewExercise.rounds"
                                   class="w-16 bg-black/20 border border-white/5 rounded-xl px-3 py-2.5 text-sm text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="3">
                            <span class="text-[10px] text-muted uppercase font-bold">Runden</span>
                        </div>
                        <p class="text-[10px] text-blue-400/70 uppercase tracking-wider font-bold">Übungen im Zirkel:</p>
                        <template x-for="(ce, ceIdx) in trainingNewExercise.circuitExercises" :key="ceIdx">
                            <div class="flex items-center gap-1.5">
                                <span class="text-[10px] text-muted w-4 text-center shrink-0" x-text="ceIdx + 1"></span>
                                <input type="text" x-model="ce.name"
                                       class="flex-1 bg-black/20 border border-white/5 rounded-lg px-2.5 py-2 text-xs text-white focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Übung">
                                <input type="text" x-model="ce.reps"
                                       class="w-12 bg-black/20 border border-white/5 rounded-lg px-2 py-2 text-xs text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Wdh.">
                                <input type="number" inputmode="decimal" step="0.5" x-model="ce.weight"
                                       class="w-12 bg-black/20 border border-white/5 rounded-lg px-2 py-2 text-xs text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="kg">
                                <input type="text" x-model="ce.duration"
                                       class="w-14 bg-black/20 border border-white/5 rounded-lg px-2 py-2 text-xs text-white font-mono text-center focus:border-white/20 outline-none transition-colors placeholder-white/15" placeholder="Zeit">
                                <button x-show="trainingNewExercise.circuitExercises.length > 1" @click="removeCircuitExerciseField(ceIdx)" class="p-1 text-muted hover:text-rose-400 transition-colors shrink-0">
                                    <i class="ph ph-x text-xs"></i>
                                </button>
                            </div>
                        </template>
                        <div class="flex gap-2">
                            <button type="button" @click="addCircuitExerciseField()"
                                    class="flex-1 py-2 rounded-lg border border-dashed border-white/10 text-[10px] text-muted hover:text-white hover:border-white/20 transition-all">
                                <i class="ph ph-plus text-xs"></i> Übung hinzufügen
                            </button>
                            <button @click="addExercise()"
                                    class="px-4 py-2 rounded-lg bg-blue-500/15 text-blue-400 font-bold text-xs border border-blue-500/20 hover:bg-blue-500/25 hover:border-blue-500/40 active:scale-95 transition-all">
                                <i class="ph ph-plus"></i> Hinzufügen
                            </button>
                        </div>
                    </div>
                    <input type="text" x-model="trainingNewExercise.note" @keydown.enter="addExercise()"
                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-2.5 text-xs text-muted focus:border-white/20 focus:text-white outline-none transition-colors" placeholder="Notiz (optional)">
                </div>
            </div>
        </div>

        <!-- Generator-Hinweis -->
        <div class="px-6 pt-4 pb-0 shrink-0">
            <button type="button" @click="closeTraining(); openTrainingSelection()"
                    class="w-full py-3 rounded-xl border border-dashed border-blue-500/20 bg-blue-500/5 text-blue-400 text-xs font-medium hover:bg-blue-500/10 hover:border-blue-500/30 active:scale-[0.97] transition-all flex items-center justify-center gap-2">
                <i class="ph-bold ph-magic-wand text-sm"></i>
                Plan automatisch generieren lassen
            </button>
        </div>

        <div class="p-6 border-t border-white/5 bg-surface z-20 flex gap-3 shrink-0">
            <button type="button" @click="closeTraining()" class="flex-1 py-3.5 rounded-xl border border-white/5 text-muted font-bold text-xs hover:bg-white/5 active:scale-[0.97] transition-all">
                Abbrechen
            </button>
            <button type="button" @click="applyTraining()" class="flex-1 py-3.5 rounded-xl bg-white text-black font-bold text-xs hover:bg-gray-200 active:scale-[0.97] transition-all shadow-lg shadow-white/5">
                Plan speichern
            </button>
        </div>
    </div>
</div>

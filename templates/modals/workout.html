<!-- Workout Session Modal -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-mobile-sheet"
     :class="workoutOpen ? 'pointer-events-auto' : 'pointer-events-none'"
     role="dialog" aria-modal="true" aria-label="Workout Session">

    <div class="absolute inset-0 bg-[var(--backdrop)] backdrop-blur-xl"
         x-show="workoutOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeWorkout()"></div>

    <div class="bg-surface border border-[var(--glass-border)] rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col relative z-10 shadow-2xl overflow-hidden"
         x-show="workoutOpen"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <!-- Header -->
        <div class="p-5 border-b border-[var(--glass-border)] bg-surface z-20 shrink-0">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-emerald-500/15 flex items-center justify-center text-emerald-400 border border-emerald-500/20">
                        <i class="ph-bold ph-barbell text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-foreground">Workout</h2>
                        <div class="flex items-center gap-2">
                            <p class="text-[10px] text-muted uppercase tracking-widest font-mono" x-text="workoutDuration"></p>
                            <span x-show="workoutSession && workoutSession.tracked === false"
                                  class="px-1.5 py-0.5 rounded text-[8px] font-bold uppercase bg-yellow-500/15 text-yellow-400">Ohne Tracking</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" @click="closeWorkout()" class="text-muted hover:text-foreground transition-colors p-2 hover:bg-[var(--glass)] rounded-xl">
                        <i class="ph ph-x text-lg"></i>
                    </button>
                </div>
            </div>
            <!-- Progress bar -->
            <div class="h-1.5 w-full bg-[var(--glass)] rounded-full overflow-hidden">
                <div class="h-full bg-emerald-500 rounded-full transition-all duration-500 ease-out" :style="`width: ${workoutCompletionPercent}%`"></div>
            </div>
            <div class="flex justify-between mt-1.5">
                <span class="text-[10px] text-muted font-mono" x-text="workoutCompletionPercent + '% abgeschlossen'"></span>
            </div>
        </div>

        <!-- Exercise List -->
        <div class="overflow-y-auto flex-1 px-5 py-4 custom-scrollbar space-y-4">
            <template x-if="workoutSession">
                <template x-for="(exercise, exIdx) in workoutSession.exercises" :key="exIdx">
                    <div class="rounded-2xl bg-[var(--glass)] border border-[var(--glass-border)] overflow-hidden">
                        <!-- Exercise Header -->
                        <div class="px-4 py-3 border-b border-[var(--glass-border)]">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <h3 class="text-sm font-bold text-foreground" x-text="exercise.name"></h3>
                                    <span x-show="exercise.type && exercise.type !== 'strength'"
                                          class="px-1.5 py-0.5 rounded text-[8px] font-bold uppercase"
                                          :class="{
                                              'bg-orange-500/15 text-orange-400': exercise.type === 'cardio',
                                              'bg-blue-500/15 text-blue-400': exercise.type === 'distance',
                                              'bg-violet-500/15 text-violet-400': exercise.type === 'circuit'
                                          }"
                                          x-text="exercise.type === 'cardio' ? 'Cardio' : (exercise.type === 'circuit' ? 'Zirkel' : 'Distanz')"></span>
                                </div>
                                <span class="text-[10px] font-mono text-muted"
                                      x-text="(exercise.type || 'strength') === 'strength' ? exercise.planned_sets + 'x' + exercise.planned_reps : (exercise.type === 'cardio' ? (exercise.planned_duration || '') : (exercise.type === 'circuit' ? (exercise.planned_rounds + ' Runden') : ((exercise.planned_distance || '') + ' km')))"></span>
                            </div>
                            <p x-show="exercise.note" class="text-[10px] text-muted mt-0.5" x-text="exercise.note"></p>
                        </div>

                        <!-- TRACKED: Strength: Sets with weight/reps -->
                        <div x-show="(exercise.type || 'strength') === 'strength' && exercise.tracked !== false" class="px-4 py-2 space-y-1.5">
                            <div class="grid grid-cols-[2rem,1fr,1fr,2.5rem] gap-2 text-[9px] text-muted uppercase tracking-wider font-bold px-1">
                                <span>Set</span>
                                <span>Kg</span>
                                <span>Reps</span>
                                <span></span>
                            </div>
                            <template x-for="(set, setIdx) in exercise.sets" :key="setIdx">
                                <div class="grid grid-cols-[2rem,1fr,1fr,2.5rem] gap-2 items-center relative">
                                    <span class="text-xs font-bold text-muted tabular-nums text-center" x-text="setIdx + 1"></span>
                                    <input type="number" inputmode="decimal" step="0.5"
                                           x-model.number="set.weight"
                                           class="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] rounded-lg px-2.5 py-2 text-sm text-foreground font-mono text-center focus:outline-none focus:border-emerald-500/40 transition-colors"
                                           :class="set.done && 'opacity-50'"
                                           placeholder="0">
                                    <input type="number" inputmode="numeric"
                                           x-model.number="set.reps"
                                           class="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] rounded-lg px-2.5 py-2 text-sm text-foreground font-mono text-center focus:outline-none focus:border-emerald-500/40 transition-colors"
                                           :class="set.done && 'opacity-50'"
                                           placeholder="0">
                                    <button @click="toggleSet(exIdx, setIdx)"
                                            class="w-9 h-9 rounded-lg flex items-center justify-center transition-all active:scale-90"
                                            :class="set.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                        <span class="text-sm" x-text="set.done ? '✓' : ''"></span>
                                    </button>
                                </div>
                            </template>
                            <button @click="addWorkoutSet(exIdx)"
                                    class="w-full py-2 rounded-lg border border-dashed border-[var(--glass-border)] text-[11px] text-muted hover:text-foreground hover:border-[var(--glass-hover)] transition-all">
                                + Set hinzufuegen
                            </button>
                        </div>

                        <!-- UNTRACKED: Strength (just a done toggle) -->
                        <div x-show="(exercise.type || 'strength') === 'strength' && exercise.tracked === false" class="px-4 py-3">
                            <div class="flex items-center justify-between">
                                <p class="text-xs text-muted" x-text="exercise.planned_sets + ' Sets x ' + exercise.planned_reps + ' Reps'"></p>
                                <button @click="toggleExerciseDone(exIdx)"
                                        class="w-10 h-10 rounded-lg flex items-center justify-center transition-all active:scale-90"
                                        :class="exercise.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                    <span class="text-sm" x-text="exercise.done ? '✓' : ''"></span>
                                </button>
                            </div>
                        </div>

                        <!-- TRACKED: Cardio: Duration input + done -->
                        <div x-show="exercise.type === 'cardio' && exercise.tracked !== false" class="px-4 py-3">
                            <div class="flex items-center gap-3">
                                <div class="flex-1">
                                    <label class="text-[9px] text-muted uppercase font-bold mb-1 block">Dauer</label>
                                    <input type="text" x-model="exercise.duration"
                                           class="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] rounded-lg px-3 py-2 text-sm text-foreground font-mono focus:outline-none focus:border-emerald-500/40 transition-colors"
                                           :class="exercise.done && 'opacity-50'"
                                           :placeholder="exercise.planned_duration || '30 min'">
                                </div>
                                <button @click="toggleExerciseDone(exIdx)"
                                        class="w-10 h-10 rounded-lg flex items-center justify-center transition-all active:scale-90 mt-4"
                                        :class="exercise.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                    <span class="text-sm" x-text="exercise.done ? '✓' : ''"></span>
                                </button>
                            </div>
                        </div>

                        <!-- UNTRACKED: Cardio (just a done toggle) -->
                        <div x-show="exercise.type === 'cardio' && exercise.tracked === false" class="px-4 py-3">
                            <div class="flex items-center justify-between">
                                <p class="text-xs text-muted" x-text="exercise.planned_duration || 'Cardio'"></p>
                                <button @click="toggleExerciseDone(exIdx)"
                                        class="w-10 h-10 rounded-lg flex items-center justify-center transition-all active:scale-90"
                                        :class="exercise.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                    <span class="text-sm" x-text="exercise.done ? '✓' : ''"></span>
                                </button>
                            </div>
                        </div>

                        <!-- TRACKED: Distance: Distance + Duration + done -->
                        <div x-show="exercise.type === 'distance' && exercise.tracked !== false" class="px-4 py-3">
                            <div class="flex items-center gap-3">
                                <div class="flex-1">
                                    <label class="text-[9px] text-muted uppercase font-bold mb-1 block">Distanz</label>
                                    <input type="text" x-model="exercise.distance"
                                           class="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] rounded-lg px-3 py-2 text-sm text-foreground font-mono focus:outline-none focus:border-emerald-500/40 transition-colors"
                                           :class="exercise.done && 'opacity-50'"
                                           :placeholder="(exercise.planned_distance || '5') + ' km'">
                                </div>
                                <div class="flex-1">
                                    <label class="text-[9px] text-muted uppercase font-bold mb-1 block">Dauer</label>
                                    <input type="text" x-model="exercise.duration"
                                           class="w-full bg-[var(--input-bg)] border border-[var(--glass-border)] rounded-lg px-3 py-2 text-sm text-foreground font-mono focus:outline-none focus:border-emerald-500/40 transition-colors"
                                           :class="exercise.done && 'opacity-50'"
                                           :placeholder="exercise.planned_duration || '30 min'">
                                </div>
                                <button @click="toggleExerciseDone(exIdx)"
                                        class="w-10 h-10 rounded-lg flex items-center justify-center transition-all active:scale-90 mt-4"
                                        :class="exercise.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                    <span class="text-sm" x-text="exercise.done ? '✓' : ''"></span>
                                </button>
                            </div>
                        </div>

                        <!-- UNTRACKED: Distance (just a done toggle) -->
                        <div x-show="exercise.type === 'distance' && exercise.tracked === false" class="px-4 py-3">
                            <div class="flex items-center justify-between">
                                <p class="text-xs text-muted" x-text="(exercise.planned_distance || '') + ' km · ' + (exercise.planned_duration || '')"></p>
                                <button @click="toggleExerciseDone(exIdx)"
                                        class="w-10 h-10 rounded-lg flex items-center justify-center transition-all active:scale-90"
                                        :class="exercise.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                    <span class="text-sm" x-text="exercise.done ? '✓' : ''"></span>
                                </button>
                            </div>
                        </div>

                        <!-- TRACKED: Circuit: Exercises list + round checkmarks -->
                        <div x-show="exercise.type === 'circuit' && exercise.tracked !== false" class="px-4 py-2">
                            <!-- Circuit exercises overview -->
                            <div x-show="exercise.circuitExercises && exercise.circuitExercises.length > 0" class="mb-2 pb-2 border-b border-[var(--glass-border)]">
                                <p class="text-[9px] text-muted uppercase tracking-wider font-bold mb-1">Uebungen pro Runde:</p>
                                <div class="space-y-0.5">
                                    <template x-for="(ce, ceIdx) in exercise.circuitExercises" :key="'ce-'+ceIdx">
                                        <div class="flex items-center gap-2 text-[10px]">
                                            <span class="text-muted w-3 text-center" x-text="ceIdx + 1"></span>
                                            <span class="text-foreground" x-text="ce.name"></span>
                                            <span x-show="ce.reps" class="text-muted font-mono" x-text="ce.reps + 'x'"></span>
                                            <span x-show="ce.duration" class="text-muted font-mono" x-text="ce.duration"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            <!-- Round checkmarks -->
                            <div class="space-y-1.5">
                                <template x-for="(round, roundIdx) in exercise.rounds" :key="'round-'+roundIdx">
                                    <div class="flex items-center justify-between py-1.5 px-2 rounded-lg" :class="round.done ? 'bg-emerald-500/5' : ''">
                                        <span class="text-xs font-bold text-muted" x-text="'Runde ' + (roundIdx + 1)"></span>
                                        <button @click="toggleCircuitRound(exIdx, roundIdx)"
                                                class="w-9 h-9 rounded-lg flex items-center justify-center transition-all active:scale-90"
                                                :class="round.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                            <span class="text-sm" x-text="round.done ? '✓' : ''"></span>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- UNTRACKED: Circuit (just a done toggle) -->
                        <div x-show="exercise.type === 'circuit' && exercise.tracked === false" class="px-4 py-3">
                            <div class="flex items-center justify-between">
                                <p class="text-xs text-muted" x-text="exercise.planned_rounds + ' Runden'"></p>
                                <button @click="toggleExerciseDone(exIdx)"
                                        class="w-10 h-10 rounded-lg flex items-center justify-center transition-all active:scale-90"
                                        :class="exercise.done ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted hover:text-foreground'">
                                    <span class="text-sm" x-text="exercise.done ? '✓' : ''"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- Rest Timer Overlay -->
        <div x-show="restTimer.active"
             class="sticky bottom-0 left-0 right-0 p-4 bg-surface/95 backdrop-blur-xl border-t border-[var(--glass-border)] z-30"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-y-full opacity-0"
             x-transition:enter-end="translate-y-0 opacity-100">
            <div class="flex items-center gap-4">
                <div class="relative w-14 h-14 shrink-0">
                    <svg class="w-full h-full -rotate-90" viewBox="0 0 36 36">
                        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                              fill="none" stroke="var(--glass-border)" stroke-width="3"/>
                        <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                              fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"
                              :stroke-dasharray="`${restTimerProgress}, 100`"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <span class="text-xs font-mono font-bold text-foreground" x-text="restTimerDisplay"></span>
                    </div>
                </div>
                <div class="flex-1">
                    <p class="text-[10px] text-muted uppercase tracking-widest font-bold mb-2">Pause</p>
                    <div class="flex gap-1.5">
                        <template x-for="dur in [60, 90, 120, 180]" :key="dur">
                            <button @click="setRestDuration(dur)"
                                    class="px-2.5 py-1 rounded-lg text-[10px] font-bold transition-all border"
                                    :class="restTimer.defaultDuration === dur ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-[var(--glass)] text-muted border-[var(--glass-border)]'"
                                    x-text="dur < 120 ? dur + 's' : (dur / 60) + 'm'"></button>
                        </template>
                    </div>
                </div>
                <button @click="skipRestTimer()" class="w-10 h-10 rounded-full bg-[var(--glass)] border border-[var(--glass-border)] flex items-center justify-center text-muted hover:text-foreground transition-all">
                    <i class="ph ph-skip-forward"></i>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-5 border-t border-[var(--glass-border)] bg-surface z-20 flex gap-3 shrink-0">
            <button type="button" @click="cancelWorkout()" class="flex-1 py-3.5 rounded-xl border border-[var(--glass-border)] text-muted font-bold text-xs hover:bg-[var(--glass)] active:scale-[0.97] transition-all">
                Abbrechen
            </button>
            <button type="button" @click="finishWorkout()" class="flex-1 py-3.5 rounded-xl bg-emerald-500 text-white font-bold text-xs hover:bg-emerald-600 active:scale-[0.97] transition-all shadow-lg shadow-emerald-500/20">
                Workout beenden
            </button>
        </div>
    </div>
</div>

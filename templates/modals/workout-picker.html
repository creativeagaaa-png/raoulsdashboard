<!-- Workout Picker Modal -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-mobile-sheet"
     :class="workoutPickerOpen ? 'pointer-events-auto' : 'pointer-events-none'"
     role="dialog" aria-modal="true" aria-label="Workout starten">

    <div class="absolute inset-0 bg-[var(--backdrop)] backdrop-blur-xl"
         x-show="workoutPickerOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeWorkoutPicker()"></div>

    <div class="bg-surface border border-[var(--glass-border)] rounded-3xl w-full max-w-lg max-h-[85vh] flex flex-col relative z-10 shadow-2xl overflow-hidden"
         x-show="workoutPickerOpen"
         x-swipe-dismiss="closeWorkoutPicker()"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <!-- Grab Handle -->
        <div class="flex justify-center pt-3 pb-1 md:hidden"><div class="w-10 h-1 rounded-full bg-white/15"></div></div>

        <!-- Header -->
        <div class="p-5 border-b border-[var(--glass-border)] bg-surface z-20 shrink-0">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-emerald-500/15 flex items-center justify-center text-emerald-400 border border-emerald-500/20">
                        <i class="ph-bold ph-play text-lg"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-foreground">Workout starten</h2>
                        <p class="text-[10px] text-muted uppercase tracking-widest font-mono" x-text="todayWeekday"></p>
                    </div>
                </div>
                <button type="button" @click="closeWorkoutPicker()" class="text-muted hover:text-foreground transition-colors p-2 hover:bg-[var(--glass)] rounded-xl">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Exercise Selection -->
        <div class="overflow-y-auto flex-1 px-5 py-4 custom-scrollbar">
            <div class="flex items-center justify-between mb-3">
                <p class="text-[10px] text-muted uppercase tracking-widest font-bold">Übungen auswählen</p>
                <button @click="selectAllPickerExercises()"
                        class="text-[10px] font-bold text-emerald-400 hover:text-emerald-300 transition-colors px-2 py-1 rounded-lg hover:bg-emerald-500/10">
                    <span x-text="workoutPickerExercises.every(e => e.selected) ? 'Keine' : 'Alle'"></span>
                </button>
            </div>

            <div class="space-y-2">
                <template x-for="(ex, idx) in workoutPickerExercises" :key="idx">
                    <button @click="togglePickerExercise(idx)"
                            class="w-full flex items-center gap-3 p-3.5 rounded-2xl border transition-all duration-200 text-left"
                            :class="ex.selected
                                ? 'bg-emerald-500/10 border-emerald-500/25 hover:bg-emerald-500/15'
                                : 'bg-[var(--glass)] border-[var(--glass-border)] opacity-50 hover:opacity-70'">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 transition-all"
                             :class="ex.selected ? 'bg-emerald-500 text-white' : 'bg-[var(--glass)] border border-[var(--glass-border)] text-muted'">
                            <i class="text-sm" :class="ex.selected ? 'ph-bold ph-check' : ''"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold text-foreground truncate" x-text="ex.name"></p>
                            <p class="text-[10px] font-mono text-muted mt-0.5"
                               x-text="(ex.type || 'strength') === 'strength'
                                   ? (ex.sets ? ex.sets + 'x' + ex.reps + (ex.weight ? ' · ' + ex.weight + 'kg' : '') : 'Kraft')
                                   : (ex.type === 'cardio' ? (ex.duration || 'Cardio') : (ex.type === 'circuit' ? (ex.rounds ? ex.rounds + ' Runden' : 'Zirkel') : ((ex.distance ? ex.distance + ' km' : '') + (ex.duration ? ' · ' + ex.duration : 'Distanz'))))">
                            </p>
                        </div>
                        <span class="px-1.5 py-0.5 rounded text-[8px] font-bold uppercase shrink-0"
                              :class="{
                                  'bg-emerald-500/15 text-emerald-400': (ex.type || 'strength') === 'strength',
                                  'bg-orange-500/15 text-orange-400': ex.type === 'cardio',
                                  'bg-blue-500/15 text-blue-400': ex.type === 'distance',
                                  'bg-violet-500/15 text-violet-400': ex.type === 'circuit'
                              }"
                              x-text="(ex.type || 'strength') === 'strength' ? 'Kraft' : (ex.type === 'cardio' ? 'Cardio' : (ex.type === 'circuit' ? 'Zirkel' : 'Distanz'))"></span>
                    </button>
                </template>
            </div>

            <!-- Tracking Toggle -->
            <div class="mt-5 p-4 rounded-2xl bg-[var(--glass)] border border-[var(--glass-border)]">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center border"
                             :class="workoutTrackingEnabled ? 'bg-indigo-500/15 border-indigo-500/20 text-indigo-400' : 'bg-[var(--glass)] border-[var(--glass-border)] text-muted'">
                            <i class="ph-bold ph-chart-line-up text-sm"></i>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-foreground">Training tracken</p>
                            <p class="text-[10px] text-muted mt-0.5">Gewichte, Reps & Zeiten dokumentieren</p>
                        </div>
                    </div>
                    <button @click="workoutTrackingEnabled = !workoutTrackingEnabled"
                            class="relative w-11 h-6 rounded-full transition-colors duration-200 shrink-0"
                            :class="workoutTrackingEnabled ? 'bg-emerald-500' : 'bg-white/10'">
                        <div class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform duration-200"
                             :class="workoutTrackingEnabled ? 'translate-x-[22px]' : 'translate-x-0.5'"></div>
                    </button>
                </div>
                <p x-show="!workoutTrackingEnabled" class="text-[10px] text-yellow-400/70 mt-2 pl-11">
                    Ohne Tracking werden keine Gewichte/Reps gespeichert – nur Übungen als erledigt markiert.
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="p-5 border-t border-[var(--glass-border)] bg-surface z-20 flex gap-3 shrink-0">
            <button type="button" @click="closeWorkoutPicker()" class="flex-1 py-3.5 rounded-xl border border-[var(--glass-border)] text-muted font-bold text-xs hover:bg-[var(--glass)] active:scale-[0.97] transition-all">
                Abbrechen
            </button>
            <button type="button" @click="startWorkout(true)"
                    class="flex-1 py-3.5 rounded-xl bg-emerald-500 text-white font-bold text-xs hover:bg-emerald-600 active:scale-[0.97] transition-all shadow-lg shadow-emerald-500/20 disabled:opacity-30 disabled:pointer-events-none"
                    :disabled="!workoutPickerExercises.some(e => e.selected)">
                <i class="ph-bold ph-play mr-1"></i>
                <span x-text="workoutPickerExercises.filter(e => e.selected).length + ' Übungen starten'"></span>
            </button>
        </div>
    </div>
</div>

<!-- BMI Detail Modal -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-mobile-sheet"
     :class="bmiDetailOpen ? 'pointer-events-auto' : 'pointer-events-none'"
     role="dialog" aria-modal="true" aria-label="BMI Details">

    <div class="absolute inset-0 bg-[#050505]/90 backdrop-blur-xl"
         x-show="bmiDetailOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeBmiDetail()"></div>
    <div class="bg-surface border border-white/10 rounded-3xl w-full max-w-sm max-h-[85vh] flex flex-col relative z-10 shadow-2xl overflow-hidden"
         x-show="bmiDetailOpen"
         x-swipe-dismiss="closeBmiDetail()"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <!-- Grab Handle -->
        <div class="flex justify-center pt-3 pb-1 md:hidden"><div class="w-10 h-1 rounded-full bg-white/15"></div></div>

        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-surface z-20 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center text-white/60 border border-white/5">
                    <i class="ph-bold ph-heartbeat text-lg"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white">BMI Übersicht</h2>
                    <p class="text-[10px] text-muted">Basierend auf deiner Körpergröße (<span x-text="userHeight"></span> cm)</p>
                </div>
            </div>
            <button type="button" @click="closeBmiDetail()" class="text-muted hover:text-white transition-colors p-2 -mr-2 hover:bg-white/5 rounded-xl">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <div class="overflow-y-auto p-6 space-y-4 custom-scrollbar">
            <div class="p-4 rounded-2xl border border-white/10 bg-white/5 text-center">
                <p class="text-[10px] text-muted uppercase tracking-wider font-bold mb-1">Dein aktueller BMI</p>
                <div class="flex items-center justify-center gap-3">
                    <span class="text-3xl font-bold text-white tabular-nums" x-text="bmi.value"></span>
                    <span class="text-xs font-bold px-2 py-1 rounded-lg" :class="bmi.color + ' text-white'" x-text="bmi.label"></span>
                </div>
                <p class="text-xs text-muted mt-2">bei <span x-text="currentWeight.toFixed(1)"></span> kg & <span x-text="userHeight"></span> cm</p>
            </div>

            <div class="space-y-2">
                <template x-for="range in bmiRanges" :key="range.label">
                    <div class="p-3 rounded-xl border transition-all"
                         :class="bmi.label === range.label
                             ? range.border + ' bg-white/10'
                             : 'border-white/5 bg-white/[0.02]'">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2.5">
                                <div class="w-2.5 h-2.5 rounded-full shrink-0" :class="range.color"></div>
                                <div>
                                    <span class="text-sm font-bold" :class="bmi.label === range.label ? 'text-white' : 'text-white/60'" x-text="range.label"></span>
                                    <span class="text-[10px] text-muted ml-1.5">BMI <span x-text="range.bmi"></span></span>
                                </div>
                            </div>
                            <div x-show="bmi.label === range.label" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-white/10 text-white/80">AKTUELL</div>
                        </div>
                        <div class="mt-1.5 text-xs text-muted pl-5">
                            <template x-if="range.min && range.max">
                                <span><span x-text="range.min"></span> – <span x-text="range.max"></span> kg</span>
                            </template>
                            <template x-if="!range.min && range.max">
                                <span>unter <span x-text="range.max"></span> kg</span>
                            </template>
                            <template x-if="range.min && !range.max">
                                <span>ab <span x-text="range.min"></span> kg</span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <div class="p-6 border-t border-white/5 bg-surface z-20 shrink-0">
            <button type="button" @click="closeBmiDetail()" class="w-full py-3.5 rounded-xl border border-white/5 text-muted font-bold text-xs hover:bg-white/5 active:scale-[0.97] transition-all">
                Schließen
            </button>
        </div>
    </div>
</div>

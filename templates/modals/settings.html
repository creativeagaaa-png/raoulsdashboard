<!-- Settings / Danger Zone Modal -->
<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-mobile-sheet"
     :class="settingsOpen ? 'pointer-events-auto' : 'pointer-events-none'"
     role="dialog" aria-modal="true" aria-label="Einstellungen">

    <div class="absolute inset-0 bg-[var(--backdrop)] backdrop-blur-xl"
         x-show="settingsOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         @click="closeSettings()"></div>
    <div class="bg-surface border border-[var(--glass-border)] rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col relative z-10 shadow-2xl overflow-hidden"
         x-show="settingsOpen"
         x-swipe-dismiss="closeSettings()"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <!-- Grab Handle -->
        <div class="flex justify-center pt-3 pb-1 md:hidden"><div class="w-10 h-1 rounded-full bg-white/15"></div></div>

        <div class="p-6 border-b border-white/5 flex justify-between items-center bg-surface z-20 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-white/5 flex items-center justify-center text-white/60 border border-white/5">
                    <i class="ph ph-gear text-lg"></i>
                </div>
                <h2 class="text-lg font-bold text-white">Einstellungen</h2>
            </div>
            <button type="button" @click="closeSettings()" class="text-muted hover:text-white transition-colors p-2 -mr-2 hover:bg-white/5 rounded-xl">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <div class="overflow-y-auto p-6 space-y-6 custom-scrollbar">
            <!-- Konto -->
            <section>
                <h3 class="text-[10px] font-bold text-muted uppercase tracking-widest mb-3">Konto</h3>
                <div class="rounded-2xl border border-[var(--glass-border)] overflow-hidden">
                    <div class="flex items-center gap-3 px-4 py-3.5 border-b border-[var(--glass-border)]">
                        <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-muted border border-white/5">
                            <i class="ph ph-envelope text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-white truncate" x-text="authUser?.email || '–'"></p>
                            <p class="text-[10px] text-muted">Angemeldet als</p>
                        </div>
                    </div>
                    <button type="button" @click="handleLogout(); closeSettings()"
                            class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-white/5 transition-all text-left">
                        <div class="w-8 h-8 rounded-lg bg-rose-500/10 flex items-center justify-center text-rose-400 border border-rose-500/20">
                            <i class="ph ph-sign-out text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-semibold text-white">Abmelden</p>
                        </div>
                        <i class="ph ph-caret-right text-white/20"></i>
                    </button>
                </div>
            </section>

            <!-- Schnellzugriff -->
            <section>
                <h3 class="text-[10px] font-bold text-muted uppercase tracking-widest mb-3">Schnellzugriff</h3>
                <div class="rounded-2xl border border-[var(--glass-border)] overflow-hidden">
                    <button type="button" @click="openTraining(); closeSettings()"
                            class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-white/5 transition-all text-left border-b border-[var(--glass-border)]">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/12 flex items-center justify-center text-blue-400 border border-blue-500/20">
                            <i class="ph ph-barbell text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-semibold text-white">Trainingsplan</p>
                            <p class="text-[10px] text-muted">7-Tage Plan bearbeiten</p>
                        </div>
                        <i class="ph ph-caret-right text-white/20"></i>
                    </button>
                    <button type="button" @click="openProfile(); closeSettings()"
                            class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-white/5 transition-all text-left">
                        <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-muted border border-white/5">
                            <i class="ph ph-user text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-semibold text-white">Profil bearbeiten</p>
                            <p class="text-[10px] text-muted">Gewicht, Größe, Ziele</p>
                        </div>
                        <i class="ph ph-caret-right text-white/20"></i>
                    </button>
                </div>
            </section>

            <!-- Benachrichtigungen -->
            <section>
                <h3 class="text-[10px] font-bold text-muted uppercase tracking-widest mb-3">Benachrichtigungen</h3>
                <div class="rounded-2xl border border-[var(--glass-border)] overflow-hidden">
                    <div class="flex items-center gap-3 px-4 py-3.5">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center border"
                             :class="pushEnabled ? 'bg-emerald-500/15 border-emerald-500/20 text-emerald-400' : 'bg-white/5 border-white/5 text-muted'">
                            <i class="ph-bold ph-bell-ringing text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-semibold text-white">Tägliche Erinnerung</p>
                            <p class="text-[10px] text-muted" x-text="pushEnabled ? 'Aktiv — ' + pushReminderTime + ' Uhr' : 'Deaktiviert'"></p>
                        </div>
                        <button @click="togglePushNotifications()"
                                :disabled="pushLoading"
                                class="relative w-11 h-6 rounded-full transition-colors duration-200 shrink-0 disabled:opacity-50"
                                :class="pushEnabled ? 'bg-emerald-500' : 'bg-white/10'">
                            <div class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform duration-200"
                                 :class="pushEnabled ? 'translate-x-[22px]' : 'translate-x-0.5'"></div>
                        </button>
                    </div>
                    <div x-show="pushEnabled" x-collapse class="border-t border-[var(--glass-border)]">
                        <div class="flex items-center gap-3 px-4 py-3.5">
                            <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-muted border border-white/5">
                                <i class="ph ph-clock text-sm"></i>
                            </div>
                            <div class="flex-1">
                                <p class="text-sm font-semibold text-white">Uhrzeit</p>
                            </div>
                            <input type="time" x-model="pushReminderTime" @change="updatePushReminderTime()"
                                   class="bg-black/20 border border-white/5 rounded-lg px-3 py-1.5 text-white text-sm font-mono focus:border-white/20 outline-none">
                        </div>
                    </div>
                    <div x-show="pushPermission === 'denied'" class="px-4 py-2.5 border-t border-[var(--glass-border)]">
                        <p class="text-[10px] text-rose-400">Benachrichtigungen sind im Browser blockiert. Bitte erlaube sie in den Browser-Einstellungen.</p>
                    </div>
                </div>
            </section>

            <!-- Daten -->
            <section>
                <h3 class="text-[10px] font-bold text-muted uppercase tracking-widest mb-3">Daten</h3>
                <div class="rounded-2xl border border-[var(--glass-border)] overflow-hidden">
                    <button type="button" @click="exportWeightData()"
                            class="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-white/5 transition-all text-left">
                        <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-muted border border-white/5">
                            <i class="ph ph-download-simple text-sm"></i>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm font-semibold text-white">Gewichtsdaten exportieren</p>
                            <p class="text-[10px] text-muted">CSV-Datei herunterladen</p>
                        </div>
                        <i class="ph ph-caret-right text-white/20"></i>
                    </button>
                </div>
            </section>

            <!-- Gefahrenzone -->
            <section>
                <h3 class="text-[10px] font-bold text-rose-400/80 uppercase tracking-widest mb-3">Gefahrenzone</h3>
                <div class="space-y-3">
                    <button type="button" @click="clearAllEntries()"
                            class="w-full py-3.5 rounded-xl border border-rose-500/20 text-rose-400 font-bold text-xs hover:bg-rose-500/10 hover:border-rose-500/40 active:scale-[0.97] transition-all flex items-center justify-center gap-2">
                        <i class="ph ph-trash text-sm"></i>
                        Alle Gewichtseinträge löschen
                    </button>
                    <button type="button" @click="clearAllWorkouts()"
                            class="w-full py-3.5 rounded-xl border border-rose-500/20 text-rose-400 font-bold text-xs hover:bg-rose-500/10 hover:border-rose-500/40 active:scale-[0.97] transition-all flex items-center justify-center gap-2">
                        <i class="ph ph-barbell text-sm"></i>
                        Alle Workouts löschen
                    </button>
                    <button type="button" @click="resetData()"
                            class="w-full py-3.5 rounded-xl border border-rose-500/20 text-rose-400 font-bold text-xs hover:bg-rose-500/10 hover:border-rose-500/40 active:scale-[0.97] transition-all flex items-center justify-center gap-2">
                        <i class="ph ph-warning text-sm"></i>
                        Alle Daten löschen (Zurücksetzen)
                    </button>
                </div>
            </section>
        </div>

        <div class="p-6 border-t border-white/5 bg-surface z-20 shrink-0">
            <button type="button" @click="closeSettings()" class="w-full py-3.5 rounded-xl border border-white/5 text-muted font-bold text-xs hover:bg-white/5 active:scale-[0.97] transition-all">
                Schließen
            </button>
        </div>
    </div>
</div>

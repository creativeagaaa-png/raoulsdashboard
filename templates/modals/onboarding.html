<!-- Onboarding Modal -->
<div class="fixed inset-0 z-[70] flex items-center justify-center p-4"
     x-show="onboardingOpen" x-cloak
     role="dialog" aria-modal="true" aria-label="Willkommen">

    <div class="absolute inset-0 bg-[var(--backdrop)] backdrop-blur-xl"
         x-show="onboardingOpen"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"></div>

    <div class="bg-surface border border-[var(--glass-border)] rounded-3xl w-full max-w-md max-h-[85vh] flex flex-col relative z-10 shadow-2xl overflow-hidden"
         x-show="onboardingOpen"
         x-transition:enter="transition ease-out duration-400" x-transition:enter-start="translate-y-12 opacity-0 scale-90" x-transition:enter-end="translate-y-0 opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0 opacity-100 scale-100" x-transition:leave-end="translate-y-12 opacity-0 scale-90">

        <!-- Header -->
        <div class="p-6 border-b border-[var(--glass-border)] bg-surface z-20 shrink-0 text-center">
            <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center mx-auto mb-4 border border-white/5">
                <i class="ph-bold ph-hand-waving text-2xl text-white"></i>
            </div>
            <template x-if="onboardingMode === 'full'">
                <div>
                    <h2 class="text-xl font-bold text-white">Willkommen bei TrAction!</h2>
                    <p class="text-xs text-muted mt-1.5">Richte dein Profil ein, um loszulegen.</p>
                </div>
            </template>
            <template x-if="onboardingMode === 'name_only'">
                <div>
                    <h2 class="text-xl font-bold text-white">Willkommen zurück!</h2>
                    <p class="text-xs text-muted mt-1.5">Wie sollen wir dich nennen?</p>
                </div>
            </template>
        </div>

        <!-- Form -->
        <form @submit.prevent="completeOnboarding()" class="flex flex-col flex-1 min-h-0">
            <div class="overflow-y-auto p-6 space-y-5 custom-scrollbar">
                <!-- Display Name -->
                <div class="space-y-2">
                    <label class="text-[10px] text-muted uppercase font-bold tracking-wider">Anzeigename</label>
                    <input type="text" x-model="onboardingForm.displayName"
                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-white font-bold focus:border-white/20 outline-none transition-colors placeholder-white/15"
                           placeholder="Dein Name" minlength="2" required>
                    <p x-show="_isGoogleUser()" class="text-[10px] text-muted">Vorausgefüllt von deinem Google-Konto — du kannst es ändern</p>
                </div>

                <!-- Full onboarding fields -->
                <template x-if="onboardingMode === 'full'">
                    <div class="space-y-5">
                        <!-- Gender -->
                        <div class="space-y-2">
                            <label class="text-[10px] text-muted uppercase font-bold tracking-wider">Geschlecht</label>
                            <div class="flex gap-2">
                                <button type="button" @click="onboardingForm.gender = 'male'"
                                        :class="onboardingForm.gender === 'male' ? 'bg-white text-black' : 'bg-black/20 text-white border border-white/5'"
                                        class="flex-1 py-3 rounded-xl font-bold text-xs transition-all active:scale-[0.97]">
                                    Männlich
                                </button>
                                <button type="button" @click="onboardingForm.gender = 'female'"
                                        :class="onboardingForm.gender === 'female' ? 'bg-white text-black' : 'bg-black/20 text-white border border-white/5'"
                                        class="flex-1 py-3 rounded-xl font-bold text-xs transition-all active:scale-[0.97]">
                                    Weiblich
                                </button>
                            </div>
                        </div>

                        <!-- Height + Age -->
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-[10px] text-muted uppercase font-bold tracking-wider">Größe</label>
                                <div class="relative">
                                    <input type="number" x-model="onboardingForm.userHeight"
                                           min="100" max="250" inputmode="numeric"
                                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-white font-bold focus:border-white/20 outline-none transition-colors placeholder-white/15"
                                           placeholder="175">
                                    <span class="absolute right-4 top-3.5 text-xs text-muted">cm</span>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] text-muted uppercase font-bold tracking-wider">Alter</label>
                                <input type="number" x-model="onboardingForm.userAge"
                                       min="10" max="120" inputmode="numeric"
                                       class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-white font-bold focus:border-white/20 outline-none transition-colors placeholder-white/15"
                                       placeholder="25">
                            </div>
                        </div>

                        <!-- Start + Goal Weight -->
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-[10px] text-muted uppercase font-bold tracking-wider">Startgewicht</label>
                                <div class="relative">
                                    <input type="number" step="0.1" x-model="onboardingForm.startWeight"
                                           min="30" max="300" inputmode="decimal"
                                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-white font-bold focus:border-white/20 outline-none transition-colors placeholder-white/15"
                                           placeholder="80.0">
                                    <span class="absolute right-4 top-3.5 text-xs text-muted">kg</span>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] text-muted uppercase font-bold tracking-wider">Zielgewicht</label>
                                <div class="relative">
                                    <input type="number" step="0.1" x-model="onboardingForm.goalWeight"
                                           min="30" max="300" inputmode="decimal"
                                           class="w-full bg-black/20 border border-white/5 rounded-xl px-4 py-3 text-white font-bold focus:border-white/20 outline-none transition-colors placeholder-white/15"
                                           placeholder="75.0">
                                    <span class="absolute right-4 top-3.5 text-xs text-muted">kg</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Footer -->
            <div class="p-6 border-t border-[var(--glass-border)] bg-surface z-20 shrink-0">
                <button type="submit"
                        :disabled="onboardingLoading"
                        class="w-full py-3.5 rounded-xl bg-white text-black font-bold text-sm hover:bg-gray-200 active:scale-[0.97] transition-all shadow-lg shadow-white/5 disabled:opacity-50 disabled:pointer-events-none">
                    <span x-show="!onboardingLoading">Los geht's</span>
                    <span x-show="onboardingLoading" class="flex items-center justify-center gap-2">
                        <i class="ph-bold ph-spinner animate-spin"></i> Wird gespeichert...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>

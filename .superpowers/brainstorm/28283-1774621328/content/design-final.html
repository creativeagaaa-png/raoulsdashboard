<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrAction Auth – Final Design</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #080808;
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    gap: 60px;
  }

  h2 { font-size: 15px; font-weight: 600; color: #444; letter-spacing: 1px; text-align: center; }

  /* ── Dotted Background ── */
  .scene {
    position: relative;
    width: 100%;
    max-width: 960px;
    height: 620px;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .scene-bg {
    position: absolute;
    inset: 0;
    background: #080808;
    background-image: radial-gradient(circle, #252525 1.2px, transparent 1.2px);
    background-size: 22px 22px;
  }

  /* Radial vignette so form stays readable without a card */
  .scene-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 50% 80% at center,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.35) 50%,
      rgba(0,0,0,0.75) 100%
    );
  }

  /* ── Auth Form ── */
  .auth {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Wordmark */
  .wm {
    font-size: 56px;
    font-weight: 800;
    letter-spacing: -3.5px;
    line-height: 1;
    text-align: center;
    margin-bottom: 5px;
  }
  .wm .tr { color: #383838; }
  .wm .ac { color: #ffffff; }

  .tagline {
    font-size: 8px;
    letter-spacing: 7px;
    color: #2e2e2e;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 36px;
  }

  /* Horizontal rule matching dot grid rhythm */
  .rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.10), transparent);
    margin-bottom: 28px;
  }

  /* Tabs — underline style */
  .tabs {
    display: flex;
    width: 100%;
    margin-bottom: 32px;
    gap: 0;
  }
  .tab {
    flex: 1;
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 3px;
    padding-bottom: 10px;
    color: #2a2a2a;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab.on {
    color: #fff;
    border-bottom: 2px solid rgba(255,255,255,0.6);
    padding-bottom: 9px;
  }

  /* Fields */
  .fields { width: 100%; display: flex; flex-direction: column; gap: 20px; margin-bottom: 28px; }

  .field { width: 100%; }
  .field-lbl {
    font-size: 8px;
    color: #2e2e2e;
    text-transform: uppercase;
    letter-spacing: 3.5px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .field-inp {
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 8px 0;
    transition: border-color 0.2s;
  }
  .field-inp.focused { border-bottom-color: rgba(255,255,255,0.35); }
  .field-icon { width: 14px; height: 14px; opacity: 0.25; flex-shrink: 0; }
  .field-text { font-size: 13px; color: #555; }
  .field-text.active { color: #ccc; }

  /* Submit */
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: #ffffff;
    color: #000;
    border-radius: 10px;
    font-weight: 800;
    font-size: 12px;
    text-align: center;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(255,255,255,0.06);
  }

  /* Forgot */
  .forgot {
    font-size: 10px;
    color: #2a2a2a;
    margin-bottom: 24px;
    cursor: pointer;
  }

  /* Or divider */
  .or-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin-bottom: 16px;
  }
  .or-line { flex: 1; height: 1px; background: rgba(255,255,255,0.05); }
  .or-txt { font-size: 8px; color: #252525; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

  /* Google */
  .btn-google {
    width: 100%;
    padding: 12px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    font-size: 11px;
    color: #3a3a3a;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .btn-google:hover { border-color: rgba(255,255,255,0.12); color: #555; }

  /* ── Side by side comparison ── */
  .comparison {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 960px;
  }
  .comp-item {
    flex: 1;
    min-width: 280px;
    max-width: 440px;
  }
  .comp-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
  }

  /* ── State toggles ── */
  .state-btns {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    justify-content: center;
  }
  .state-btn {
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    font-size: 10px;
    color: #444;
    cursor: pointer;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .state-btn:hover { border-color: rgba(255,255,255,0.2); color: #aaa; }

  /* Error state */
  .auth-error {
    width: 100%;
    margin-bottom: 16px;
    border-left: 2px solid rgba(239, 68, 68, 0.6);
    padding: 8px 12px;
    font-size: 11px;
    color: rgba(239, 68, 68, 0.8);
    display: none;
  }
  .auth-error.show { display: block; }

  /* G icon */
  .g-icon {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: conic-gradient(#4285F4 0deg 90deg, #EA4335 90deg 180deg, #FBBC05 180deg 270deg, #34A853 270deg);
    flex-shrink: 0;
  }

  /* SVG icons */
  .icon-envelope, .icon-lock { display: block; }
</style>
</head>
<body>

<h2>TRACION AUTH — FINALES DESIGN</h2>

<!-- Main Preview -->
<div class="scene">
  <div class="scene-bg"></div>
  <div class="scene-vignette"></div>

  <div class="auth" id="authForm">

    <div class="wm"><span class="tr">Tr</span><span class="ac">Action</span></div>
    <div class="tagline">TRAIN · TRACK · ACT</div>

    <div class="rule"></div>

    <div class="tabs">
      <div class="tab on" onclick="switchTab('login',this)">Anmelden</div>
      <div class="tab" onclick="switchTab('register',this)">Registrieren</div>
    </div>

    <div class="auth-error" id="errMsg">E-Mail oder Passwort falsch.</div>

    <div class="fields">
      <div class="field">
        <div class="field-lbl">E-Mail</div>
        <div class="field-inp focused">
          <svg class="field-icon" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="3" width="14" height="10" rx="2" stroke="white" stroke-width="1.2"/>
            <path d="M1 5l7 5 7-5" stroke="white" stroke-width="1.2"/>
          </svg>
          <span class="field-text active">agachi80@yahoo.de</span>
        </div>
      </div>
      <div class="field">
        <div class="field-lbl">Passwort</div>
        <div class="field-inp">
          <svg class="field-icon" viewBox="0 0 16 16" fill="none">
            <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="white" stroke-width="1.2"/>
            <path d="M5 7V5a3 3 0 0 1 6 0v2" stroke="white" stroke-width="1.2"/>
          </svg>
          <span class="field-text">••••••••••</span>
        </div>
      </div>
    </div>

    <div class="btn-submit">Anmelden</div>

    <div class="forgot">Passwort vergessen?</div>

    <div class="or-row">
      <div class="or-line"></div>
      <div class="or-txt">oder</div>
      <div class="or-line"></div>
    </div>

    <div class="btn-google">
      <div class="g-icon"></div>
      Mit Google fortfahren
    </div>

  </div>
</div>

<!-- State toggles -->
<div class="state-btns">
  <div class="state-btn" onclick="toggleError()">Fehler-State toggle</div>
  <div class="state-btn" onclick="switchMode()">Anmelden / Registrieren</div>
</div>

<script>
let showErr = false;
let mode = 'login';

function toggleError() {
  showErr = !showErr;
  document.getElementById('errMsg').classList.toggle('show', showErr);
}

function switchMode() {
  mode = mode === 'login' ? 'register' : 'login';
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach((t,i) => {
    if (mode === 'login') t.classList.toggle('on', i===0);
    else t.classList.toggle('on', i===1);
  });
  document.querySelector('.btn-submit').textContent = mode === 'login' ? 'Anmelden' : 'Registrieren';
  document.querySelector('.forgot').style.display = mode === 'login' ? 'block' : 'none';
}

function switchTab(m, el) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  document.querySelector('.btn-submit').textContent = m === 'login' ? 'Anmelden' : 'Registrieren';
  document.querySelector('.forgot').style.display = m === 'login' ? 'block' : 'none';
}
</script>

</body>
</html>

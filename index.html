<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TrAction">
    <title>TrAction</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <meta name="format-detection" content="telephone=no">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="css/styles.css">

    <script type="module" src="js/main.js"></script>
</head>
<body class="bg-background text-foreground antialiased min-h-screen flex justify-center px-4 md:px-8 selection:bg-accent/30 safe-area-body"
      x-data="app()"
      x-init="initApp()"
      @keydown.escape.window="handleEscape()"
      x-cloak>

    <!-- Loading Screen -->
    <div class="loading-screen" x-show="!appLoaded" x-transition:leave="transition ease-in duration-500" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">
        <div class="loading-content">
            <div class="loading-logo">
                <div class="loading-ring"></div>
                <span class="loading-icon"><i class="ph-bold ph-lightning"></i></span>
            </div>
            <h1 class="loading-title">TrAction</h1>
            <div class="loading-bar-track">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="fixed inset-0 pointer-events-none -z-10 bg-[radial-gradient(circle_at_top,var(--tw-gradient-stops))] from-accent/5 via-background to-background" aria-hidden="true"></div>
    <div class="fixed top-[-20%] right-[-10%] w-150 h-150 bg-accent/10 blur-[120px] rounded-full pointer-events-none" aria-hidden="true"></div>

    <!-- Pull to Refresh Indicator -->
    <div id="ptr-indicator" class="ptr-container" aria-hidden="true">
        <div class="ptr-content">
            <div class="ptr-icon">
                <i class="ph ph-arrow-clockwise"></i>
            </div>
        </div>
    </div>

    <!-- Offline Indicator -->
    <div x-show="isOffline" x-cloak
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 -translate-y-full" x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-full"
         class="offline-indicator" role="status" aria-live="polite">
        <i class="ph ph-wifi-slash text-sm"></i>
        <span>Offline</span>
    </div>

    <!-- Init Error Indicator -->
    <div x-show="_initFailed && appLoaded" x-cloak
         class="fixed top-12 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold flex items-center gap-2 cursor-pointer"
         @click="refreshDashboard()">
        <i class="ph ph-warning text-sm"></i>
        <span>Laden fehlgeschlagen — tippen zum Wiederholen</span>
    </div>

    <main x-show="authUser" class="w-full max-w-275 grid grid-cols-1 md:grid-cols-12 gap-5 pb-24 content-start stagger-load" role="main" aria-label="TrAction Dashboard">

        <header class="md:col-span-12 flex flex-row justify-between items-end mb-2 gap-4 md:gap-6 animate-slide-up" style="--delay: 0s">
            <div class="min-w-0">
                <div class="flex items-center gap-2 mb-1.5 md:mb-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <p class="text-muted text-[11px] md:text-[11px] font-bold tracking-[0.2em] uppercase font-mono">TrAction</p>
                </div>
                <h1 class="text-[2rem] md:text-5xl font-extrabold tracking-tight text-white leading-none">
                    Hallo, <span class="text-transparent bg-clip-text bg-linear-to-r from-white to-white/50" x-text="displayName || 'dort'"></span>
                </h1>
            </div>

            <div class="shrink-0">
                <div class="glass-panel p-1.5 pr-3.5 md:pr-5 rounded-full flex items-center gap-2.5 md:gap-4 hover:border-white/20 transition-colors duration-300 cursor-pointer select-none"
                     role="button" tabindex="0" aria-label="Menü öffnen"
                     @click="toggleProfileDropdown()" @keydown.enter="toggleProfileDropdown()">
                    <div class="h-9 w-9 md:h-10 md:w-10 rounded-full bg-surface-highlight border border-white/10 overflow-hidden relative group">
                        <img :src="'https://ui-avatars.com/api/?name=' + encodeURIComponent(displayName || 'U') + '&background=000&color=fff&bold=true'" class="h-full w-full object-cover group-hover:scale-110 transition-transform duration-500" alt="Avatar">
                    </div>

                    <div class="flex flex-col items-end">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] md:text-xs font-bold text-white tabular-nums"><span x-text="streakDays"></span> Tage Serie</span>
                        </div>
                        <div class="flex gap-0.75 mt-1" role="img" :aria-label="streakDays + ' Tage Eintragsserie'">
                            <template x-for="i in 5">
                                <div class="w-2.5 h-1 rounded-full transition-all duration-500"
                                     :class="i <= Math.min(streakDays, 5) ? 'bg-accent shadow-[0_0_8px_rgba(255,255,255,0.5)]' : 'bg-white/10'" aria-hidden="true"></div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== HEALTH DASHBOARD ===== -->
        <template x-if="activeTab === 'health'">
            <div class="md:col-span-12 grid grid-cols-1 md:grid-cols-12 gap-5 animate-slide-up" style="--delay: 0.1s">

                <!-- Left Column -->
                <div class="md:col-span-4 flex flex-col gap-5">

                    <!-- Current Status -->
                    <div class="bento-card p-8 flex flex-col justify-between min-h-95 relative group overflow-hidden" role="region" aria-label="Aktueller Gewichtsstatus">
                        <div class="absolute -top-20 -right-20 w-64 h-64 bg-accent/10 blur-[80px] rounded-full group-hover:bg-accent/20 transition-colors duration-700" aria-hidden="true"></div>
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-4">
                                <div class="flex flex-col">
                                    <span class="text-muted text-[10px] font-bold uppercase tracking-widest">Aktueller Status</span>
                                    <span class="text-xs text-white/50 font-mono mt-0.5" x-text="history.length ? 'Aktualisiert ' + new Date(history[history.length-1].date).toLocaleDateString('de-DE', {day: '2-digit', month: 'short'}) : 'Noch keine Daten'"></span>
                                </div>
                                <div x-show="trend.value !== 0" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 border border-white/5 backdrop-blur-md">
                                    <i class="text-sm" :class="trend.isLoss ? 'ph ph-trend-down text-emerald-400' : 'ph ph-trend-up text-rose-400'" aria-hidden="true"></i>
                                    <span class="text-xs font-mono font-bold" :class="trend.isLoss ? 'text-emerald-400' : 'text-rose-400'" x-text="Math.abs(trend.value).toFixed(1)"></span>
                                </div>
                            </div>
                            <div class="flex items-baseline gap-1 mt-6 relative">
                                <h2 class="text-6xl md:text-8xl font-bold text-white tracking-tighter tabular-nums" x-text="displayWeight.toFixed(1)"></h2>
                                <span class="text-2xl text-white/40 font-medium">kg</span>
                            </div>
                            <div class="mt-8 grid grid-cols-2 gap-3">
                                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 backdrop-blur-sm cursor-pointer hover:bg-white/10 transition-colors" @click="openBmiDetail()">
                                    <p class="text-[10px] text-muted uppercase tracking-wider font-bold mb-1">BMI</p>
                                    <div class="flex items-end gap-2">
                                        <span class="text-xl font-bold text-white tabular-nums" x-text="displayBmi.toFixed(1)"></span>
                                        <div class="w-2 h-2 rounded-full mb-1.5" :class="bmi.color"></div>
                                    </div>
                                </div>
                                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 backdrop-blur-sm">
                                    <p class="text-[10px] text-muted uppercase tracking-wider font-bold mb-1" x-text="displayLost >= 0 ? 'Verloren' : 'Zugenommen'"></p>
                                    <div class="flex items-end gap-2">
                                        <span class="text-xl font-bold tabular-nums" :class="displayLost >= 0 ? 'text-white' : 'text-rose-400'" x-text="Math.abs(displayLost).toFixed(1)"></span>
                                        <span class="text-xs text-muted mb-0.5">kg</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-4 z-10 mt-auto pt-6">
                            <div>
                                <div class="flex justify-between text-[10px] font-bold text-muted uppercase tracking-widest mb-2">
                                    <span>Zielfortschritt</span>
                                    <span x-text="Math.round(displayProgress) + '%'"></span>
                                </div>
                                <div class="h-2 w-full bg-surface-highlight rounded-full overflow-hidden p-0.5">
                                    <div class="h-full rounded-full bg-linear-to-r from-white/80 to-white shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all duration-300 ease-out" :style="`width: ${displayProgress}%`"></div>
                                </div>
                            </div>
                            <button @click="openModal()" class="group w-full py-4 rounded-xl bg-white text-black font-bold text-sm hover:scale-[1.02] active:scale-[0.96] transition-all duration-200 flex justify-center items-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                                <i class="ph-bold ph-plus text-lg transition-transform duration-300 group-hover:rotate-90" aria-hidden="true"></i>
                                <span>Gewicht eintragen</span>
                            </button>
                            <div x-show="currentWeight > 0" class="flex items-center justify-center gap-2 mt-1 rounded-xl py-1.5 px-2 transition-all duration-500" :class="todayWeight === null ? 'bg-white/4 border border-white/6 quicklog-nudge' : ''">
                                <span class="text-[10px] text-muted uppercase tracking-widest font-bold" x-text="todayWeight === null ? 'Noch kein Eintrag' : 'Heute'"></span>
                                <button @click="quickLogStep(-0.1)" class="w-9 h-9 rounded-full bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/15 text-muted hover:text-white transition-all active:scale-90 tactile-press flex items-center justify-center" aria-label="Minus 0,1 kg"><span class="text-xs">&#xFF0D;</span></button>
                                <span class="text-sm font-mono tabular-nums w-16 text-center transition-colors" :class="quickLogWeight !== null ? 'text-white' : 'text-white/40'" x-text="quickLogDisplay.toFixed(1)"></span>
                                <button @click="quickLogStep(+0.1)" class="w-9 h-9 rounded-full bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/15 text-muted hover:text-white transition-all active:scale-90 tactile-press flex items-center justify-center" aria-label="Plus 0,1 kg"><span class="text-xs">&#xFF0B;</span></button>
                                <button x-show="quickLogWeight !== null" @click="quickLogSave()" class="w-9 h-9 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/30 transition-all active:scale-90 flex items-center justify-center" aria-label="Speichern"
                                        x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100">
                                    <i class="ph ph-check text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Prediction -->
                    <div class="bento-card p-6 relative overflow-hidden flex flex-col justify-center min-h-45" role="region" aria-label="Smarte Vorhersage">
                        <div class="absolute inset-0 bg-linear-to-br from-indigo-500/5 to-purple-500/5"></div>
                        <div class="flex items-center gap-3 mb-4 relative z-10">
                            <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 border border-indigo-500/20"><i class="ph ph-sparkle"></i></div>
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Smarte Vorhersage</h3>
                            <span x-show="oracle.valid && oracle.confidence" class="ml-auto px-2 py-0.5 rounded-full text-[9px] font-bold uppercase" :class="{'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20': oracle.confidence==='high','bg-yellow-500/10 text-yellow-400 border border-yellow-500/20': oracle.confidence==='medium','bg-white/5 text-muted border border-white/5': oracle.confidence==='low'}" x-text="oracle.confidence === 'high' ? 'Hoch' : oracle.confidence === 'medium' ? 'Mittel' : 'Niedrig'"></span>
                        </div>
                        <div x-show="oracle.valid && !oracle.noProgress" class="relative z-10">
                            <div class="flex flex-col"><span class="text-xs text-muted mb-1">Geschätztes Zieldatum</span><span class="text-2xl font-bold text-white tabular-nums tracking-tight" x-text="oracle.date"></span></div>
                            <div class="mt-3 flex items-center gap-2 flex-wrap">
                                <span class="bg-indigo-500/10 px-2 py-1 rounded border border-indigo-500/20 text-xs font-mono text-indigo-300" x-text="oracle.rate + ' kg/Woche'"></span>
                                <span x-show="weeklyTrend.change !== null" class="px-2 py-1 rounded border text-xs font-mono" :class="weeklyTrend.change < 0 ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20' : 'bg-rose-500/10 text-rose-300 border-rose-500/20'" x-text="'Woche: ' + (weeklyTrend.change > 0 ? '+' : '') + (weeklyTrend.change ? weeklyTrend.change.toFixed(2) : '0.00') + ' kg'"></span>
                            </div>
                        </div>
                        <div x-show="oracle.valid && oracle.isPlateau" class="mt-3 p-3 rounded-xl bg-yellow-500/5 border border-yellow-500/10 relative z-10">
                            <div class="flex items-center gap-2 mb-1"><i class="ph ph-warning text-yellow-400 text-sm"></i><span class="text-[10px] font-bold text-yellow-400 uppercase tracking-wider">Plateau erkannt</span></div>
                            <p class="text-[11px] text-yellow-200/70 leading-relaxed" x-text="oracle.plateauTip"></p>
                        </div>
                        <div x-show="oracle.valid && oracle.noProgress && !oracle.isPlateau" class="relative z-10"><p class="text-xs text-muted leading-relaxed">Kein Abwärtstrend erkannt. Weitermachen!</p></div>
                        <div x-show="!oracle.valid" class="relative z-10 opacity-60"><p class="text-xs text-muted leading-relaxed">Noch nicht genug Daten.</p></div>
                    </div>

                    <!-- Tagesanalyse -->
                    <template x-if="getDailyAnalysis()">
                        <div class="bento-card p-5" x-data="{ analysis: getDailyAnalysis() }" x-effect="analysis = getDailyAnalysis()" role="region" aria-label="Tagesanalyse">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="w-8 h-8 rounded-lg flex items-center justify-center border"
                                     :class="analysis.direction === 'good' ? 'bg-emerald-500/20 border-emerald-500/20 text-emerald-400' : analysis.direction === 'bad' ? 'bg-orange-500/20 border-orange-500/20 text-orange-400' : 'bg-white/10 border-white/10 text-muted'">
                                    <i class="ph text-sm" :class="analysis.direction === 'good' ? 'ph-trend-down' : analysis.direction === 'bad' ? 'ph-trend-up' : 'ph-minus'"></i>
                                </div>
                                <div>
                                    <h3 class="text-sm font-bold text-white">Tagesanalyse</h3>
                                    <p class="text-[11px] font-mono mt-0.5"
                                       :class="analysis.direction === 'good' ? 'text-emerald-400' : analysis.direction === 'bad' ? 'text-orange-400' : 'text-muted'"
                                       x-text="(analysis.diff > 0 ? '+' : '') + analysis.diff.toFixed(1) + ' kg seit gestern'"></p>
                                </div>
                            </div>

                            <!-- Analysis text -->
                            <p class="text-[13px] text-white/80 leading-relaxed" x-text="analysis.message"></p>

                            <!-- No checkin data hint -->
                            <template x-if="!analysis.hasCheckinData">
                                <p class="text-[11px] text-white/30 italic mt-2">Trage deine Gewohnheiten täglich ein, um detaillierte Analysen zu erhalten.</p>
                            </template>
                        </div>
                    </template>

                </div>

                <!-- Right Column -->
                <div class="md:col-span-8 flex flex-col gap-5">

                    <!-- Analytics -->
                    <div class="bento-card p-5 md:p-8 h-75 md:h-100 flex flex-col relative overflow-hidden" role="region" aria-label="Gewichtsanalyse-Diagramm"
                         x-init="$nextTick(() => { renderChart(); })">
                        <div class="flex justify-between items-start mb-6 z-10">
                            <div><h3 class="font-bold text-white text-lg">Statistiken</h3><p class="text-xs text-muted mt-1">Gewichtsverlauf & Gleitender Durchschnitt</p></div>
                            <div class="flex gap-2" role="group">
                                <template x-for="f in ['1M', '3M', 'ALL']" :key="f">
                                    <button @click="setChartFilter(f)" class="px-3 py-1 rounded-full text-[10px] font-bold border transition-all duration-200" :class="chartFilter === f ? 'bg-white/10 text-white border-white/5' : 'bg-transparent text-muted border-transparent hover:text-white'"><span x-text="f"></span></button>
                                </template>
                            </div>
                        </div>
                        <div class="grow w-full h-full relative z-10"><canvas id="mainChart" role="img" aria-label="Gewichtsverlauf-Diagramm"></canvas></div>
                    </div>

                    <!-- Logs -->
                    <div class="bento-card p-6" role="region" aria-label="Letzte Gewichtseinträge">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Letzte Einträge</h3>
                            <span class="px-2 py-1 rounded-md bg-white/5 border border-white/5 text-[10px] font-bold text-muted font-mono" x-text="history.length + ' Einträge'"></span>
                        </div>
                        <div class="space-y-1 max-h-62.5 overflow-y-auto pr-2 custom-scrollbar" role="list">
                            <template x-for="(entry, index) in logs" :key="entry.date + '-' + index">
                                <div class="swipe-container" role="listitem"
                                     x-data="{ startX: 0, currentX: 0, swiping: false }"
                                     @touchstart.passive="startX = $event.touches[0].clientX; currentX = 0; swiping = false"
                                     @touchmove="(() => {
                                         const dx = $event.touches[0].clientX - startX;
                                         if (dx < -10) { swiping = true; currentX = Math.max(dx, -120); $event.preventDefault(); }
                                     })()"
                                     @touchend="(() => {
                                         if (currentX < -80) { $el.querySelector('.swipe-content').classList.add('removing'); $el.querySelector('.swipe-content').style.transform = 'translateX(-100%)'; setTimeout(() => deleteEntry(index), 300); }
                                         else { currentX = 0; swiping = false; }
                                     })()">
                                    <div class="swipe-delete-bg" :class="{ 'visible': currentX < -10 }">
                                        <i class="ph ph-trash text-rose-400 text-lg"></i>
                                    </div>
                                    <div class="swipe-content group flex items-center justify-between p-3 rounded-xl hover:bg-white/5 transition-all duration-300 border border-transparent hover:border-white/5"
                                         :class="{ 'swiping': swiping }"
                                         :style="currentX < 0 ? 'transform: translateX(' + currentX + 'px)' : ''">
                                        <div class="flex items-center gap-4">
                                            <div class="w-10 h-10 rounded-full bg-surface-highlight flex items-center justify-center text-xs text-muted font-mono border border-white/5 group-hover:border-white/20 transition-colors"><span x-text="new Date(entry.date).getDate()"></span></div>
                                            <div>
                                                <p class="text-white font-bold tabular-nums text-sm group-hover:text-accent transition-colors">
                                                    <span x-text="entry.weight.toFixed(1)"></span> kg
                                                </p>
                                                <p class="text-muted text-[10px] uppercase tracking-wider" x-text="new Date(entry.date).toLocaleDateString('de-DE', { month: 'short', year: 'numeric' })"></p>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <template x-if="getLogDelta(index) !== null">
                                                <span class="text-[10px] font-mono font-bold px-2 py-1 rounded bg-black/20"
                                                      :class="(getLogDelta(index) ?? 0) < 0 ? 'text-emerald-400' : 'text-rose-400'"
                                                      x-text="((getLogDelta(index) ?? 0) > 0 ? '+' : '') + (getLogDelta(index) ?? 0).toFixed(1)"></span>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>
            </div>
        </template>

        <!-- ===== TRAINING DASHBOARD ===== -->
        <template x-if="activeTab === 'training'">
            <div class="md:col-span-12 max-w-lg mx-auto w-full space-y-3 animate-fade-in" x-data="{ weekDates: getWeekDates(), weekStats: getWeekTrainingStats() }" x-effect="weekStats = getWeekTrainingStats()">

                <!-- Hero Card -->
                <div class="bento-card p-6 text-center" role="region" aria-label="Heutiges Training">
                    <p class="text-[11px] font-bold text-[#0a84ff] uppercase tracking-[1.5px] mb-1.5">Heutiges Training</p>
                    <p class="text-[42px] font-extrabold text-white leading-none" x-text="selectedDayName"></p>
                    <div class="inline-flex items-center gap-1.5 mt-3 px-3.5 py-1.5 rounded-full text-[11px] font-bold"
                         :class="selectedDayExercises.length === 0 ? 'bg-white/5 text-muted' : 'bg-[#0a84ff]/12 text-[#0a84ff]'">
                        <span x-text="selectedDayExercises.length === 0 ? '😴' : '⚡'"></span>
                        <span x-text="selectedDayExercises.length === 0 ? 'Ruhetag' : selectedDayExercises.length + ' Übungen'"></span>
                    </div>
                </div>

                <!-- Wochentag-Leiste -->
                <div class="bento-card p-4">
                    <div class="flex justify-between gap-1">
                        <template x-for="(day, i) in WEEKDAY_SHORT" :key="i">
                            <div class="flex-1 text-center py-2 px-1 rounded-xl cursor-pointer transition-all"
                                 :class="selectedDayIndex === i ? 'bg-[#0a84ff]/15 border border-[#0a84ff]/30' : 'border border-transparent'"
                                 @click="selectTrainingDay(i)">
                                <div class="text-[10px] font-semibold"
                                     :class="selectedDayIndex === i ? 'text-[#0a84ff]' : 'text-muted'" x-text="day"></div>
                                <div class="text-base font-bold my-0.5"

        <!-- Plan Tab -->

                                    <span class="text-sm text-muted">Gesamtumsatz (TDEE)</span>

                                </div>

                                    <span class="text-sm" :class="calorieData.adjustment < 0 ? 'text-red-400' : calorieData.adjustment > 0 ? 'text-emerald-400' : 'text-muted'"

                                </div>
                            </div>

                            </template>
                        </div>

                                </div>
                            </div>

                    </div>

            </div>

        <!-- Habits Tab -->

                    </div>
                </div>

                        <div class="flex items-center gap-2">

                            </button>

                                <i class="ph" :class="checkinEditMode ? 'ph-check' : 'ph-pencil-simple'"></i>
                                <span x-text="checkinEditMode ? 'Fertig' : 'Bearbeiten'"></span>
                            </button>

                                <button @click="setCheckinStatus(item.key, item.status === 'done' ? 'none' : 'done')"

                                    <i class="ph ph-x text-xs"></i>
                                    <span class="text-[9px] font-medium" x-show="item.status !== 'done'">Nein</span>

                    <div class="space-y-3">

                    </button>

                            </div>
                            <div class="flex items-center justify-between px-1">
                                <span class="text-[11px] text-muted">Veränderung</span>
                                <span class="text-[11px] font-bold"
                                      :class="rd.weightData.change < 0 ? 'text-emerald-400' : rd.weightData.change > 0 ? 'text-orange-400' : 'text-muted'"
                                      x-text="(rd.weightData.change > 0 ? '+' : '') + rd.weightData.change + ' kg'"></span>
                            </div>
                            <!-- Compare -->
                            <template x-if="cd && cd.weightData">
                                <div class="mt-2 pt-2 border-t border-white/5 flex items-center justify-between px-1">
                                    <span class="text-[10px] text-indigo-400">vs. Vergleichswoche</span>
                                    <span class="text-[10px] font-bold text-indigo-400"
                                          x-text="'Ø ' + (rd.weightData.avg - cd.weightData.avg > 0 ? '+' : '') + (rd.weightData.avg - cd.weightData.avg).toFixed(1) + ' kg'"></span>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template x-if="!rd.weightData">
                        <p class="text-xs text-muted italic">Keine Gewichtsdaten für diese Woche.</p>
                    </template>
                </div>

                <!-- Gewohnheiten -->
                <div class="bento-card p-4">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-sm font-bold text-white">Gewohnheiten</p>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full"
                              :class="rd.overallRate >= 70 ? 'bg-emerald-500/10 text-emerald-400' : rd.overallRate >= 40 ? 'bg-yellow-500/10 text-yellow-400' : 'bg-orange-500/10 text-orange-400'"
                              x-text="rd.overallRate + '%'"></span>
                    </div>
                    <template x-if="rd.habitData.length > 0">
                        <div class="space-y-2">
                            <template x-for="habit in rd.habitData" :key="habit.key">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[11px] text-white/70 truncate flex-1" x-text="habit.label"></span>
                                        <span class="text-[10px] font-mono text-muted shrink-0" x-text="habit.daysDone + '/' + habit.daysExisted"></span>
                                        <div class="w-16 h-1.5 rounded-full bg-white/5 shrink-0 overflow-hidden">
                                            <div class="h-full rounded-full transition-all"
                                                 :class="habit.rate >= 70 ? 'bg-emerald-400' : habit.rate >= 40 ? 'bg-yellow-400' : 'bg-orange-400'"
                                                 :style="'width: ' + habit.rate + '%'"></div>
                                        </div>
                                    </div>
                                    <template x-if="habit.reasons.length > 0">
                                        <div class="ml-2 mt-1">
                                            <template x-for="(reason, ri) in habit.reasons.slice(0, 2)" :key="ri">
                                                <p class="text-[10px] text-orange-400/70 italic" x-text="'„' + reason + '\"'"></p>
                                            </template>
                                        </div>
                                    </template>
                                    <template x-if="cd">
                                        <div class="ml-2 mt-0.5">
                                            <template x-if="cd.habitData.find(h => h.key === habit.key)">
                                                <span class="text-[10px] text-indigo-400"
                                                      x-text="(() => { const cmp = cd.habitData.find(h => h.key === habit.key); const diff = habit.rate - cmp.rate; return 'vs. ' + (diff > 0 ? '+' : '') + diff + '%'; })()"></span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template x-if="rd.habitData.length === 0">
                        <p class="text-xs text-muted italic">Keine Gewohnheiten-Daten für diese Woche.</p>
                    </template>
                </div>

                    </div>
                </template>

            </div>
        </template>

        <!-- Bottom Tab Bar -->
        <nav x-show="authUser" class="fixed bottom-0 left-0 right-0 z-40 bottom-tab-bar">
            <div class="flex justify-around items-center max-w-lg mx-auto px-2 py-1">
                <button @click="switchTab('health')" class="flex flex-col items-center py-2 px-2 min-w-0 flex-1 transition-all duration-200"
                        :class="activeTab === 'health' ? 'text-emerald-500' : 'text-gray-400'">
                    <i class="text-xl" :class="activeTab === 'health' ? 'ph-fill ph-heart' : 'ph ph-heart'"></i>
                    <span class="text-[9px] font-semibold mt-0.5">Health</span>
                </button>
                <button @click="switchTab('training')" class="flex flex-col items-center py-2 px-2 min-w-0 flex-1 transition-all duration-200"
                        :class="activeTab === 'training' ? 'text-[#0a84ff]' : 'text-gray-400'">
                    <i class="text-xl" :class="activeTab === 'training' ? 'ph-fill ph-barbell' : 'ph ph-barbell'"></i>
                    <span class="text-[9px] font-semibold mt-0.5">Training</span>
                </button>
                <button @click="switchTab('plan')" class="flex flex-col items-center py-2 px-2 min-w-0 flex-1 transition-all duration-200"
                        :class="activeTab === 'plan' ? 'text-emerald-500' : 'text-gray-400'">
                    <i class="text-xl" :class="activeTab === 'plan' ? 'ph-fill ph-flame' : 'ph ph-flame'"></i>
                    <span class="text-[9px] font-semibold mt-0.5">Plan</span>
                </button>
                <button @click="switchTab('habits')" class="flex flex-col items-center py-2 px-2 min-w-0 flex-1 transition-all duration-200"
                        :class="activeTab === 'habits' ? 'text-amber-500' : 'text-gray-400'">
                    <i class="text-xl" :class="activeTab === 'habits' ? 'ph-fill ph-check-square' : 'ph ph-check-square'"></i>
                    <span class="text-[9px] font-semibold mt-0.5">Habits</span>
                </button>
                <button @click="switchTab('report')" class="flex flex-col items-center py-2 px-2 min-w-0 flex-1 transition-all duration-200"
                        :class="activeTab === 'report' ? 'text-indigo-500' : 'text-gray-400'">
                    <i class="text-xl" :class="activeTab === 'report' ? 'ph-fill ph-chart-bar' : 'ph ph-chart-bar'"></i>
                    <span class="text-[9px] font-semibold mt-0.5">Report</span>
                </button>
            </div>
        </nav>

    </main>

    <!-- Quick Menu Overlay -->
    <div class="fixed inset-0 z-55 flex items-end justify-center modal-mobile-sheet"
         :class="profileDropdownOpen ? 'pointer-events-auto' : 'pointer-events-none'"
         role="dialog" aria-modal="true" aria-label="Menü">

        <div class="absolute inset-0 bg-[var(--backdrop)] backdrop-blur-md"
             x-show="profileDropdownOpen"
             x-transition:enter="transition ease-out duration-250" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
             @click="closeProfileDropdown()"></div>

        <div class="bg-surface border border-[var(--glass-border)] rounded-t-3xl w-full max-w-md relative z-10 shadow-2xl overflow-hidden"
             x-show="profileDropdownOpen"
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-y-0" x-transition:leave-end="translate-y-full"
             style="padding-bottom: env(safe-area-inset-bottom)">

            <div class="flex justify-center pt-3 pb-2">
                <div class="w-10 h-1 rounded-full bg-white/15"></div>
            </div>

            <div class="px-5 pb-5 pt-1 space-y-1.5">

                <button @click="openProfile(); closeProfileDropdown()" class="quick-menu-item group">
                    <div class="w-10 h-10 rounded-2xl bg-white/5 flex items-center justify-center border border-white/5 shrink-0 group-active:scale-90 transition-transform">
                        <i class="ph ph-user text-lg text-white/60"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <span class="text-sm font-bold text-white block">Persönliche Daten</span>
                        <span class="text-[11px] text-muted block mt-0.5">Gewicht, Größe, Ziele</span>
                    </div>
                    <i class="ph ph-caret-right text-sm text-white/20"></i>
                </button>

                <button @click="openTraining(); closeProfileDropdown()" class="quick-menu-item group">
                    <div class="w-10 h-10 rounded-2xl bg-blue-500/10 flex items-center justify-center border border-blue-500/20 shrink-0 relative group-active:scale-90 transition-transform">
                        <i class="ph-bold ph-barbell text-lg text-blue-400"></i>
                        <span x-show="!isRestDay" class="absolute -top-1 -right-1 w-3 h-3 bg-[#0a84ff] rounded-full border-2 border-surface animate-pulse" aria-hidden="true"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <span class="text-sm font-bold text-white block">Trainingsplan</span>
                        <span class="text-[11px] text-muted block mt-0.5">Wochenplan bearbeiten</span>
                    </div>
                    <i class="ph ph-caret-right text-sm text-white/20"></i>
                </button>

                <div class="border-t border-white/5 my-2"></div>

                <button @click="openSettings(); closeProfileDropdown()" class="quick-menu-item group">
                    <div class="w-10 h-10 rounded-2xl bg-white/5 flex items-center justify-center border border-white/5 shrink-0 group-active:scale-90 transition-transform">
                        <i class="ph ph-gear text-lg text-white/60"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <span class="text-sm font-bold text-white block">Einstellungen</span>
                        <span class="text-[11px] text-muted block mt-0.5">Daten & Verwaltung</span>
                    </div>
                    <i class="ph ph-caret-right text-sm text-white/20"></i>
                </button>

                <div class="border-t border-white/5 my-2"></div>

                <button @click="handleLogout(); closeProfileDropdown()" class="quick-menu-item group">
                    <div class="w-10 h-10 rounded-2xl bg-rose-500/10 flex items-center justify-center border border-rose-500/20 shrink-0 group-active:scale-90 transition-transform">
                        <i class="ph ph-sign-out text-lg text-rose-400"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <span class="text-sm font-bold text-rose-400 block">Abmelden</span>
                        <span class="text-[11px] text-muted block mt-0.5" x-text="authUser?.email || ''"></span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile FAB: Log Weight (health tab only) -->
    <button @click="openModal()"
            class="mobile-fab md:hidden transition-transform duration-150"
            aria-label="Gewicht eintragen"
            x-show="authUser && appLoaded && activeTab === 'health' && !modalOpen && !settingsOpen && !profileOpen && !trainingOpen && !bmiDetailOpen && !workoutOpen && !workoutHistoryOpen && !workoutPickerOpen && !profileDropdownOpen"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-75"
            x-transition:enter-end="opacity-100 scale-100">
        <i class="ph-bold ph-plus text-2xl"></i>
    </button>

    <!-- Modals Container (injected by JS) -->
    <div id="modals"></div>

</body>
</html>

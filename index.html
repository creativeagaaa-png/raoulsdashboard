<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Health & Fitness Dashboard">
    <title>Raoul Agachi | Health & Fitness Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="css/styles.css">


    <script type="module" src="js/main.js"></script>
</head>
<body class="bg-background text-foreground antialiased min-h-screen flex justify-center px-4 md:px-8 selection:bg-accent/30 safe-area-body"
      x-data="app()"
      x-init="initApp()"
      @keydown.escape.window="handleEscape()"
      x-cloak>

    <!-- Loading Screen -->
    <div class="loading-screen" x-show="!appLoaded" x-transition:leave="transition ease-in duration-500" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">
        <div class="loading-content">
            <div class="loading-logo">
                <div class="loading-ring"></div>
                <span class="loading-icon"><i class="ph-bold ph-heartbeat"></i></span>
            </div>
            <h1 class="loading-title">Health & Fitness Dashboard</h1>
            <div class="loading-bar-track">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="fixed inset-0 pointer-events-none z-[-1] opacity-[0.04] mix-blend-overlay" aria-hidden="true"
         style="background-image: url('https://grainy-gradients.vercel.app/noise.svg');"></div>

    <div class="fixed inset-0 pointer-events-none -z-10 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-accent/5 via-background to-background" aria-hidden="true"></div>
    <div class="fixed top-[-20%] right-[-10%] w-[600px] h-[600px] bg-accent/10 blur-[120px] rounded-full pointer-events-none" aria-hidden="true"></div>

    <!-- Pull to Refresh Indicator -->
    <div id="ptr-indicator" class="ptr-container" aria-hidden="true">
        <div class="ptr-content">
            <div class="ptr-icon">
                <i class="ph ph-arrow-clockwise"></i>
            </div>
        </div>
    </div>

    <!-- Offline Indicator -->
    <div x-show="isOffline" x-cloak
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 -translate-y-full" x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-full"
         class="offline-indicator" role="status" aria-live="polite">
        <i class="ph ph-wifi-slash text-sm"></i>
        <span>Offline</span>
    </div>

    <main class="w-full max-w-[1100px] grid grid-cols-1 md:grid-cols-12 gap-5 pb-24 stagger-load" role="main" aria-label="Health Dashboard">

        <header class="md:col-span-12 flex flex-col md:flex-row justify-between items-start md:items-end mb-2 gap-4 md:gap-6 animate-slide-up" style="--delay: 0s">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <p class="text-muted text-[10px] font-bold tracking-[0.2em] uppercase font-mono">Health & Fitness Dashboard</p>
                </div>
                <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-white">
                    Hello, <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-white/50">Raoul</span>
                </h1>
            </div>

            <div class="flex items-center gap-2 md:gap-3 w-full md:w-auto justify-end relative"
                 @click.outside="closeProfileDropdown()">
                <div class="glass-panel p-1.5 pr-4 md:pr-5 rounded-full flex items-center gap-3 md:gap-4 hover:border-white/20 transition-colors duration-300 cursor-pointer select-none"
                     role="button" tabindex="0" aria-label="Menü öffnen" aria-haspopup="true" :aria-expanded="profileDropdownOpen"
                     @click="toggleProfileDropdown()" @keydown.enter="toggleProfileDropdown()">
                    <div class="h-9 w-9 md:h-10 md:w-10 rounded-full bg-surface-highlight border border-white/10 overflow-hidden relative group">
                        <img src="https://ui-avatars.com/api/?name=Raoul+Agachi&background=000&color=fff&bold=true" class="h-full w-full object-cover group-hover:scale-110 transition-transform duration-500" alt="Avatar">
                    </div>

                    <div class="flex flex-col items-end">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] md:text-xs font-bold text-white tabular-nums"><span x-text="streakDays"></span> Day Streak</span>
                        </div>
                        <div class="flex gap-[3px] mt-1.5" role="img" :aria-label="streakDays + ' day logging streak'">
                            <template x-for="i in 5">
                                <div class="w-2.5 h-1 rounded-full transition-all duration-500"
                                     :class="i <= Math.min(streakDays, 5) ? 'bg-accent shadow-[0_0_8px_rgba(255,255,255,0.5)]' : 'bg-white/10'" aria-hidden="true"></div>
                            </template>
                        </div>
                    </div>
                    <i class="ph ph-caret-down text-xs text-muted transition-transform duration-300" :class="profileDropdownOpen ? 'rotate-180' : ''"></i>
                </div>

                <!-- Dropdown Menu -->
                <div x-show="profileDropdownOpen" x-cloak
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95 -translate-y-2"
                     x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                     x-transition:leave="transition ease-in duration-150"
                     x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                     x-transition:leave-end="opacity-0 scale-95 -translate-y-2"
                     class="profile-dropdown absolute right-0 top-full mt-2 w-56 z-50"
                     role="menu" aria-label="Profilmenü">
                    <div class="bg-surface/95 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-2xl shadow-black/40 overflow-hidden py-1.5">

                        <button @click="openProfile(); closeProfileDropdown()" class="profile-dropdown-item" role="menuitem">
                            <div class="w-8 h-8 rounded-xl bg-white/5 flex items-center justify-center border border-white/5 shrink-0">
                                <i class="ph ph-user text-sm text-white/60"></i>
                            </div>
                            <div class="flex flex-col items-start">
                                <span class="text-xs font-bold text-white">Persönliche Daten</span>
                                <span class="text-[10px] text-muted">Gewicht, Größe, Ziele</span>
                            </div>
                        </button>

                        <button @click="openTraining(); closeProfileDropdown()" class="profile-dropdown-item" role="menuitem">
                            <div class="w-8 h-8 rounded-xl bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20 shrink-0 relative">
                                <i class="ph-bold ph-barbell text-sm text-emerald-400"></i>
                                <span x-show="!isRestDay" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-500 rounded-full border-[1.5px] border-surface animate-pulse" aria-hidden="true"></span>
                            </div>
                            <div class="flex flex-col items-start">
                                <span class="text-xs font-bold text-white">Trainingsplan</span>
                                <span class="text-[10px] text-muted">Wochenplan bearbeiten</span>
                            </div>
                        </button>

                        <button @click="openMilestones(); closeProfileDropdown()" class="profile-dropdown-item" role="menuitem">
                            <div class="w-8 h-8 rounded-xl bg-yellow-500/10 flex items-center justify-center border border-yellow-500/20 shrink-0 relative">
                                <i class="ph-bold ph-trophy text-sm text-yellow-400"></i>
                                <span x-show="rewards.length > 0" class="absolute -top-1 -right-1 min-w-[14px] h-3.5 px-0.5 bg-yellow-500 rounded-full border-[1.5px] border-surface text-[8px] font-bold flex items-center justify-center text-black" x-text="rewards.filter(r => currentWeight <= r.target).length"></span>
                            </div>
                            <div class="flex flex-col items-start">
                                <span class="text-xs font-bold text-white">Milestones</span>
                                <span class="text-[10px] text-muted">Ziele & Belohnungen</span>
                            </div>
                        </button>

                        <div class="mx-3 my-1.5 border-t border-white/5"></div>

                        <button @click="openSettings(); closeProfileDropdown()" class="profile-dropdown-item" role="menuitem">
                            <div class="w-8 h-8 rounded-xl bg-white/5 flex items-center justify-center border border-white/5 shrink-0">
                                <i class="ph ph-gear text-sm text-white/60"></i>
                            </div>
                            <div class="flex flex-col items-start">
                                <span class="text-xs font-bold text-white">Einstellungen</span>
                                <span class="text-[10px] text-muted">Daten & Verwaltung</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Tab Switcher -->
        <div class="md:col-span-12 animate-slide-up" style="--delay: 0.05s">
            <div class="glass-panel rounded-full p-1 inline-flex gap-1">
                <button @click="activeTab = 'health'"
                        class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all duration-300"
                        :class="activeTab === 'health' ? 'bg-white text-black shadow-lg shadow-white/10' : 'text-muted hover:text-white'">
                    <i class="ph-bold ph-heartbeat mr-1.5"></i>Health
                </button>
                <button @click="activeTab = 'training'"
                        class="px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all duration-300"
                        :class="activeTab === 'training' ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20' : 'text-muted hover:text-white'">
                    <i class="ph-bold ph-barbell mr-1.5"></i>Training
                </button>
            </div>
        </div>

        <!-- ===== HEALTH DASHBOARD ===== -->
        <template x-if="activeTab === 'health'">
            <div class="md:col-span-12 grid grid-cols-1 md:grid-cols-12 gap-5 animate-slide-up" style="--delay: 0.1s">
                <div class="md:col-span-4 flex flex-col gap-5">
                    <template x-for="(widgetId, wIdx) in widgetLayout.left" :key="'left-'+widgetId">
                        <div class="relative">
                            <!-- Current Status -->
                            <template x-if="widgetId === 'current-status'">
                               <div class="bento-card p-8 flex flex-col justify-between min-h-[380px] relative group overflow-hidden" role="region" aria-label="Current weight status">
                                    <div class="absolute -top-20 -right-20 w-64 h-64 bg-accent/10 blur-[80px] rounded-full group-hover:bg-accent/20 transition-colors duration-700" aria-hidden="true"></div>
                                    <div class="relative z-10">
                                        <div class="flex justify-between items-start mb-4">
                                            <div class="flex flex-col">
                                                <span class="text-muted text-[10px] font-bold uppercase tracking-widest">Current Status</span>
                                                <span class="text-xs text-white/50 font-mono mt-0.5" x-text="history.length ? 'Updated ' + new Date(history[history.length-1].date).toLocaleDateString('de-DE', {day: '2-digit', month: 'short'}) : 'No data yet'"></span>
                                            </div>
                                            <div x-show="trend.value !== 0" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white/5 border border-white/5 backdrop-blur-md">
                                                <i class="text-sm" :class="trend.isLoss ? 'ph ph-trend-down text-emerald-400' : 'ph ph-trend-up text-rose-400'" aria-hidden="true"></i>
                                                <span class="text-xs font-mono font-bold" :class="trend.isLoss ? 'text-emerald-400' : 'text-rose-400'" x-text="Math.abs(trend.value).toFixed(1)"></span>
                                            </div>
                                        </div>
                                        <div class="flex items-baseline gap-1 mt-6 relative">
                                            <h2 class="text-6xl md:text-8xl font-bold text-white tracking-tighter tabular-nums" x-text="displayWeight.toFixed(1)"></h2>
                                            <span class="text-2xl text-white/40 font-medium">kg</span>
                                        </div>
                                        <div class="mt-8 grid grid-cols-2 gap-3">
                                            <div class="p-4 rounded-2xl bg-white/5 border border-white/5 backdrop-blur-sm cursor-pointer hover:bg-white/10 transition-colors" @click="openBmiDetail()">
                                                <p class="text-[10px] text-muted uppercase tracking-wider font-bold mb-1">BMI</p>
                                                <div class="flex items-end gap-2">
                                                    <span class="text-xl font-bold text-white tabular-nums" x-text="displayBmi.toFixed(1)"></span>
                                                    <div class="w-2 h-2 rounded-full mb-1.5" :class="bmi.color"></div>
                                                </div>
                                            </div>
                                            <div class="p-4 rounded-2xl bg-white/5 border border-white/5 backdrop-blur-sm">
                                                <p class="text-[10px] text-muted uppercase tracking-wider font-bold mb-1" x-text="displayLost >= 0 ? 'Lost' : 'Gained'"></p>
                                                <div class="flex items-end gap-2">
                                                    <span class="text-xl font-bold tabular-nums" :class="displayLost >= 0 ? 'text-white' : 'text-rose-400'" x-text="Math.abs(displayLost).toFixed(1)"></span>
                                                    <span class="text-xs text-muted mb-0.5">kg</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="space-y-4 z-10 mt-auto pt-6">
                                        <div>
                                            <div class="flex justify-between text-[10px] font-bold text-muted uppercase tracking-widest mb-2">
                                                <span>Goal Progress</span>
                                                <span x-text="Math.round(displayProgress) + '%'"></span>
                                            </div>
                                            <div class="h-2 w-full bg-surface-highlight rounded-full overflow-hidden p-[2px]">
                                                <div class="h-full rounded-full bg-gradient-to-r from-white/80 to-white shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all duration-300 ease-out" :style="`width: ${displayProgress}%`"></div>
                                            </div>
                                        </div>
                                        <button @click="openModal()" class="group w-full py-4 rounded-xl bg-white text-black font-bold text-sm hover:scale-[1.02] active:scale-[0.96] transition-all duration-200 flex justify-center items-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                                            <i class="ph-bold ph-plus text-lg transition-transform duration-300 group-hover:rotate-90" aria-hidden="true"></i>
                                            <span>Log Weight</span>
                                        </button>
                                        <div x-show="currentWeight > 0" class="flex items-center justify-center gap-2 mt-1 rounded-xl py-1.5 px-2 transition-all duration-500" :class="todayWeight === null ? 'bg-white/[0.04] border border-white/[0.06] quicklog-nudge' : ''">
                                            <span class="text-[10px] text-muted uppercase tracking-widest font-bold" x-text="todayWeight === null ? 'Noch kein Eintrag' : 'Heute'"></span>
                                            <button @click="quickLogStep(-0.1)" class="w-9 h-9 rounded-full bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/15 text-muted hover:text-white transition-all active:scale-90 tactile-press flex items-center justify-center" aria-label="Minus 0.1 kg"><span class="text-xs">&#xFF0D;</span></button>
                                            <span class="text-sm font-mono tabular-nums w-16 text-center transition-colors" :class="quickLogWeight !== null ? 'text-white' : 'text-white/40'" x-text="quickLogDisplay.toFixed(1)"></span>
                                            <button @click="quickLogStep(+0.1)" class="w-9 h-9 rounded-full bg-white/5 border border-white/5 hover:bg-white/10 hover:border-white/15 text-muted hover:text-white transition-all active:scale-90 tactile-press flex items-center justify-center" aria-label="Plus 0.1 kg"><span class="text-xs">&#xFF0B;</span></button>
                                            <button x-show="quickLogWeight !== null" @click="quickLogSave()" class="w-9 h-9 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/30 transition-all active:scale-90 flex items-center justify-center" aria-label="Speichern"
                                                    x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-75" x-transition:enter-end="opacity-100 scale-100">
                                                <i class="ph ph-check text-sm"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <!-- Prediction -->
                            <template x-if="widgetId === 'prediction'">
                                <div class="bento-card p-6 relative overflow-hidden flex flex-col justify-center min-h-[180px]" role="region" aria-label="Smart prediction">
                                    <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/5 to-purple-500/5"></div>
                                    <div class="flex items-center gap-3 mb-4 relative z-10">
                                        <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 border border-indigo-500/20"><i class="ph ph-sparkle"></i></div>
                                        <h3 class="text-sm font-bold text-white uppercase tracking-wider">Smart Prediction</h3>
                                        <span x-show="oracle.valid && oracle.confidence" class="ml-auto px-2 py-0.5 rounded-full text-[9px] font-bold uppercase" :class="{'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20': oracle.confidence==='high','bg-yellow-500/10 text-yellow-400 border border-yellow-500/20': oracle.confidence==='medium','bg-white/5 text-muted border border-white/5': oracle.confidence==='low'}" x-text="oracle.confidence"></span>
                                    </div>
                                    <div x-show="oracle.valid && !oracle.noProgress" class="relative z-10">
                                        <div class="flex flex-col"><span class="text-xs text-muted mb-1">Voraussichtliches Ziel</span><span class="text-2xl font-bold text-white tabular-nums tracking-tight" x-text="oracle.date"></span></div>
                                        <div class="mt-3 flex items-center gap-2 flex-wrap">
                                            <span class="bg-indigo-500/10 px-2 py-1 rounded border border-indigo-500/20 text-xs font-mono text-indigo-300" x-text="oracle.rate + ' kg/Woche'"></span>
                                            <span x-show="weeklyTrend.change !== null" class="px-2 py-1 rounded border text-xs font-mono" :class="weeklyTrend.change < 0 ? 'bg-emerald-500/10 text-emerald-300 border-emerald-500/20' : 'bg-rose-500/10 text-rose-300 border-rose-500/20'" x-text="'Woche: ' + (weeklyTrend.change > 0 ? '+' : '') + (weeklyTrend.change ? weeklyTrend.change.toFixed(2) : '0.00') + ' kg'"></span>
                                        </div>
                                    </div>
                                    <div x-show="oracle.valid && oracle.isPlateau" class="mt-3 p-3 rounded-xl bg-yellow-500/5 border border-yellow-500/10 relative z-10">
                                        <div class="flex items-center gap-2 mb-1"><i class="ph ph-warning text-yellow-400 text-sm"></i><span class="text-[10px] font-bold text-yellow-400 uppercase tracking-wider">Plateau erkannt</span></div>
                                        <p class="text-[11px] text-yellow-200/70 leading-relaxed" x-text="oracle.plateauTip"></p>
                                    </div>
                                    <div x-show="oracle.valid && oracle.noProgress && !oracle.isPlateau" class="relative z-10"><p class="text-xs text-muted leading-relaxed">Aktuell kein Abw&auml;rtstrend erkennbar. Bleib dran!</p></div>
                                    <div x-show="!oracle.valid" class="relative z-10 opacity-60"><p class="text-xs text-muted leading-relaxed">Nicht gen&uuml;gend Daten.</p></div>
                                </div>
                            </template>

                            <!-- Milestone -->
                            <template x-if="widgetId === 'milestone'">
                                <div class="bento-card p-6 relative overflow-hidden group" role="region" aria-label="Next milestone">
                                    <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                    <div class="relative z-10 h-full flex flex-col">
                                        <div class="flex justify-between items-start mb-4">
                                            <span class="px-2.5 py-1 rounded-md bg-white/5 border border-white/5 text-[10px] font-bold uppercase tracking-wider text-white">Next Milestone</span>
                                            <i class="ph ph-flag-checkered text-xl text-white/20 group-hover:text-emerald-400 transition-colors"></i>
                                        </div>
                                        <template x-if="nextReward">
                                            <div class="mt-auto">
                                                <h4 class="text-xl font-bold text-white mb-2" x-text="nextReward.title"></h4>
                                                <div class="w-full h-1 bg-white/10 rounded-full overflow-hidden mb-2"><div class="h-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.4)] transition-all duration-1000" :style="`width: ${Math.min(Math.max(((startWeight - currentWeight) / (startWeight - nextReward.target)) * 100, 0), 100)}%`"></div></div>
                                                <div class="flex justify-between items-center text-xs font-mono text-muted"><span x-text="nextReward.target + ' kg'"></span><span class="text-emerald-400" x-text="(currentWeight - nextReward.target).toFixed(1) + ' kg left'"></span></div>
                                            </div>
                                        </template>
                                        <template x-if="!nextReward"><div class="mt-auto"><p class="text-white font-medium">All goals crushed! Set new ones.</p></div></template>
                                    </div>
                                </div>
                            </template>

                            <!-- Achievements -->
                            <template x-if="widgetId === 'achievements'">
                                <div class="bento-card p-6 flex flex-col justify-center items-center text-center group cursor-default" role="region" aria-label="Achievements">
                                    <div class="w-12 h-12 rounded-full bg-white/5 border border-white/5 flex items-center justify-center mb-4 group-hover:scale-110 group-hover:bg-white/10 transition-all duration-300"><i class="ph ph-trophy text-2xl"></i></div>
                                    <div class="mb-1"><span class="text-3xl font-bold text-white tabular-nums" x-text="rewards.filter(r => currentWeight <= r.target).length"></span><span class="text-muted text-xl mx-1">/</span><span class="text-xl text-muted tabular-nums" x-text="rewards.length"></span></div>
                                    <p class="text-[10px] text-muted uppercase tracking-widest font-bold">Achievements</p>
                                </div>
                            </template>

                            <!-- Progress Pics (no preview images, just tap to open) -->
                            <template x-if="widgetId === 'progress-pics'">
                                <div class="bento-card p-6 relative overflow-hidden cursor-pointer hover:border-white/15 transition-all"
                                     x-show="photoDates.length >= 1"
                                     @click="openProgressPics()"
                                     role="button" aria-label="Progress Pics oeffnen">
                                    <div class="absolute inset-0 bg-gradient-to-br from-purple-500/5 to-pink-500/5"></div>
                                    <div class="flex items-center gap-3 relative z-10">
                                        <div class="w-10 h-10 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400 border border-purple-500/20"><i class="ph ph-images-square text-lg"></i></div>
                                        <div class="flex-1">
                                            <h3 class="text-sm font-bold text-white uppercase tracking-wider">Progress Pics</h3>
                                            <p class="text-[10px] text-muted mt-0.5">Fortschritt in Bildern festhalten</p>
                                        </div>

                                </div>
                                <div class="flex items-center gap-2">
                                    <button @click.stop="openTraining()" class="p-1.5 rounded-lg text-muted hover:text-white hover:bg-white/5 transition-all" title="Trainingsplan bearbeiten">
                                        <i class="ph ph-note-pencil text-sm"></i>
                                    </button>
                                    <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold" :class="isRestDay ? 'bg-white/5 text-muted' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'">
                                        <i class="text-xs" :class="isRestDay ? 'ph ph-pause' : 'ph-bold ph-lightning'"></i>
                                        <span x-text="isRestDay ? 'Rest Day' : todayTraining.length + ' Uebungen'"></span>
                                    </div>
                                </div>
                            </div>
                            <template x-if="!isRestDay">
                                <div>
                                    <div class="space-y-1.5 max-h-[150px] overflow-y-auto custom-scrollbar pr-1">
                                        <template x-for="(ex, i) in todayTraining" :key="i">
                                            <div class="flex items-center gap-3 py-2 px-3 rounded-xl bg-white/[0.03] border border-white/[0.03] hover:bg-white/5 transition-all animate-list-item" :style="'--item-delay: ' + (i * 0.06) + 's'">
                                                <span class="w-5 h-5 rounded-md bg-emerald-500/10 flex items-center justify-center text-[10px] text-emerald-400 font-bold tabular-nums shrink-0" x-text="i + 1"></span>
                                                <span class="text-xs font-medium text-white flex-1 truncate" x-text="ex.name"></span>
                                                <span class="text-[10px] font-mono text-muted" x-text="(ex.type || 'strength') === 'strength' ? (ex.sets ? ex.sets + 'x' + ex.reps + (ex.weight ? ' · ' + ex.weight + 'kg' : '') : '') : (ex.type === 'cardio' ? (ex.duration || '') : (ex.type === 'circuit' ? (ex.rounds ? ex.rounds + ' Runden' : '') : ((ex.distance ? ex.distance + ' km' : '') + (ex.duration ? ' · ' + ex.duration : ''))))"></span>
                                            </div>
                                        </template>
                                    </div>
                                    <button x-show="!workoutActive && !_lastFinishedWorkout" @click.stop="openWorkoutPicker()" class="mt-3 w-full py-3 rounded-xl bg-emerald-500 text-white font-bold text-xs hover:bg-emerald-600 active:scale-[0.97] transition-all flex items-center justify-center gap-2">
                                        <i class="ph-bold ph-play"></i> Workout starten
                                    </button>
                                    <button x-show="workoutActive" @click.stop="resumeWorkout()" class="mt-3 w-full py-3 rounded-xl bg-amber-500 text-white font-bold text-xs hover:bg-amber-600 active:scale-[0.97] transition-all flex items-center justify-center gap-2 animate-pulse">
                                        <i class="ph-bold ph-play"></i> Workout fortsetzen
                                    </button>
                                    <button x-show="!workoutActive && _lastFinishedWorkout" @click.stop="showPostWorkoutComparison()" class="mt-3 w-full py-3 rounded-xl bg-indigo-500 text-white font-bold text-xs hover:bg-indigo-600 active:scale-[0.97] transition-all flex items-center justify-center gap-2"
                                            x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
                                        <i class="ph-bold ph-chart-line-up"></i> Vergleich anzeigen
                                    </button>
                                </div>
                            </template>
                            <template x-if="isRestDay">
                                <div class="py-4 text-center"><p class="text-xs text-muted">Kein Training geplant.</p></div>
                            </template>
                        </div>
                    </div>

                    <!-- Personal Records Widget -->
                    <div class="bento-card p-6 relative overflow-hidden" role="region" aria-label="Personal Records">
                        <div class="absolute inset-0 bg-gradient-to-br from-yellow-500/5 to-orange-500/5"></div>
                        <div class="relative z-10">
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-8 h-8 rounded-lg bg-yellow-500/20 flex items-center justify-center text-yellow-400 border border-yellow-500/20">
                                    <i class="ph-bold ph-crown"></i>
                                </div>
                                <h3 class="text-sm font-bold text-white uppercase tracking-wider">Personal Records</h3>
                                <span class="ml-auto px-2 py-0.5 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 text-[9px] font-bold" x-text="personalRecords.length + ' PRs'"></span>
                            </div>
                            <div class="space-y-1.5" x-show="personalRecords.length > 0">
                                <template x-for="(pr, prIdx) in getRecentPRs(5)" :key="'pr-'+prIdx">
                                    <div class="flex items-center justify-between py-2 px-3 rounded-xl bg-white/[0.03] border border-white/[0.03]">
                                        <div class="min-w-0">
                                            <p class="text-xs font-medium text-white truncate" x-text="pr.exercise_name"></p>
                                            <p class="text-[10px] text-muted font-mono" x-text="new Date(pr.date).toLocaleDateString('de-DE', {day: '2-digit', month: 'short'})"></p>
                                        </div>
                                        <span class="text-xs font-bold text-yellow-400 tabular-nums" x-text="pr.weight + ' kg x ' + pr.reps"></span>
                                    </div>
                                </template>
                            </div>
                            <div x-show="personalRecords.length === 0" class="py-4 text-center">
                                <p class="text-[10px] text-muted">Noch keine Records. Starte dein erstes Workout!</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Workout History + Stats -->
                <div class="md:col-span-8 flex flex-col gap-5">

                    <!-- Letzte Workouts Widget (only shows when history exists) -->
                    <div class="bento-card p-6 relative overflow-hidden" role="region" aria-label="Letzte Workouts">
                        <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/5 to-emerald-500/5"></div>
                        <div class="relative z-10">
                            <div class="flex items-center justify-between mb-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 border border-indigo-500/20">
                                        <i class="ph ph-clipboard-text"></i>
                                    </div>
                                    <h3 class="text-sm font-bold text-white uppercase tracking-wider">Letzte Workouts</h3>
                                </div>
                                <button x-show="workoutHistory.length > 0" @click.stop="openWorkoutHistory()" class="text-[10px] font-bold text-indigo-400 hover:text-indigo-300 transition-colors px-2 py-1 rounded-lg hover:bg-indigo-500/10">
                                    Alle anzeigen
                                </button>
                            </div>
                            <div class="space-y-1.5" x-show="workoutHistory.length > 0">
                                <template x-for="(w, wIdx) in workoutHistory.slice(0, 5)" :key="'recent-'+wIdx">
                                    <div class="flex items-center justify-between py-2.5 px-3 rounded-xl bg-white/[0.03] border border-white/[0.03] hover:bg-white/5 transition-all cursor-pointer"
                                         @click.stop="openWorkoutComparison(w)">
                                        <div class="flex items-center gap-3 min-w-0">
                                            <span class="w-8 h-8 rounded-lg bg-white/5 border border-white/5 flex items-center justify-center text-[10px] text-muted font-mono shrink-0"
                                                  x-text="new Date(w.date).getDate()"></span>
                                            <div class="min-w-0">
                                                <p class="text-xs font-medium text-white truncate" x-text="new Date(w.date).toLocaleDateString('de-DE', {weekday: 'short', day: '2-digit', month: 'short'})"></p>
                                                <p class="text-[10px] text-muted font-mono" x-text="getWorkoutExerciseCount(w) + ' Ueb. · ' + formatWorkoutDuration(w.durationSeconds)"></p>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0">
                                            <span x-show="w.tracked !== false" class="text-[9px] px-1.5 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold">
                                                <i class="ph ph-chart-line-up text-[9px]"></i>
                                            </span>
                                            <i class="ph ph-caret-right text-[10px] text-muted"></i>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div x-show="workoutHistory.length === 0" class="py-8 text-center">
                                <div class="w-14 h-14 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-center mx-auto mb-3">
                                    <i class="ph-bold ph-barbell text-2xl text-white/20"></i>
                                </div>
                                <p class="text-sm text-muted mb-1">Noch keine Workouts</p>
                                <p class="text-[10px] text-white/20">Starte dein erstes Workout oben!</p>
                            </div>
                        </div>
                    </div>

                    <!-- Training Stats Widget -->
                    <div class="bento-card p-6 relative overflow-hidden" role="region" aria-label="Training Statistiken">
                        <div class="absolute inset-0 bg-gradient-to-br from-cyan-500/5 to-blue-500/5"></div>
                        <div class="relative z-10">
                            <div class="flex items-center gap-3 mb-5">
                                <div class="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center text-cyan-400 border border-cyan-500/20">
                                    <i class="ph-bold ph-chart-bar"></i>
                                </div>
                                <h3 class="text-sm font-bold text-white uppercase tracking-wider">Statistiken</h3>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 text-center">
                                    <p class="text-2xl font-bold text-white tabular-nums" x-text="workoutHistory.length"></p>
                                    <p class="text-[9px] text-muted uppercase tracking-wider font-bold mt-1">Workouts</p>
                                </div>
                                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 text-center">
                                    <p class="text-2xl font-bold text-white tabular-nums" x-text="workoutHistory.reduce((sum, w) => sum + (w.exercises || []).length, 0)"></p>
                                    <p class="text-[9px] text-muted uppercase tracking-wider font-bold mt-1">Uebungen</p>
                                </div>
                                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 text-center">
                                    <p class="text-2xl font-bold text-white tabular-nums" x-text="Math.round(workoutHistory.reduce((sum, w) => sum + (w.durationSeconds || 0), 0) / 60)"></p>
                                    <p class="text-[9px] text-muted uppercase tracking-wider font-bold mt-1">Minuten</p>
                                </div>
                                <div class="p-4 rounded-2xl bg-white/5 border border-white/5 text-center">
                                    <p class="text-2xl font-bold text-yellow-400 tabular-nums" x-text="personalRecords.length"></p>
                                    <p class="text-[9px] text-muted uppercase tracking-wider font-bold mt-1">Records</p>
                                </div>
                            </div>
                            <!-- Weekly training overview -->
                            <div class="mt-4 pt-4 border-t border-white/5">
                                <p class="text-[10px] text-muted uppercase tracking-widest font-bold mb-3">Wochenplan</p>
                                <div class="flex gap-1.5">
                                    <template x-for="(day, idx) in WEEKDAY_SHORT" :key="'wk-'+idx">
                                        <div class="flex-1 text-center">
                                            <div class="w-full py-2 rounded-lg text-[10px] font-bold transition-all"
                                                 :class="trainingPlan[idx] && trainingPlan[idx].length > 0
                                                     ? (idx === getTodayWeekdayIndex() ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-white/5 text-white border border-white/5')
                                                     : 'bg-transparent text-white/20 border border-transparent'"
                                                 x-text="day"></div>
                                            <p class="text-[8px] text-muted mt-1 tabular-nums" x-text="trainingPlan[idx] ? trainingPlan[idx].length : 0"></p>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

    </main>

    <!-- Mobile FAB: Log Weight (visible only on mobile, only on health tab) -->
    <button @click="activeTab === 'health' ? openModal() : openWorkoutPicker()"
            class="mobile-fab md:hidden transition-transform duration-150"
            :aria-label="activeTab === 'health' ? 'Log Weight' : 'Workout starten'"
            x-show="appLoaded && !modalOpen && !settingsOpen && !profileOpen && !trainingOpen && !milestonesOpen && !bmiDetailOpen && !lootboxOpen && !workoutOpen && !workoutHistoryOpen && !prCelebrationOpen && !workoutPickerOpen && !workoutComparisonOpen && !progressPicsOpen"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-75"
            x-transition:enter-end="opacity-100 scale-100">
        <i class="text-2xl" :class="activeTab === 'health' ? 'ph-bold ph-plus' : 'ph-bold ph-play'"></i>
    </button>

    <!-- Modals Container (injected by JS) -->
    <div id="modals"></div>


</body>
</html>
